  <title>Daily Life OS — BI Pro v2.5</title>
    <style>
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --text: #182230;
  --muted: #6b7280;
  --border: #dfe5ee;
  --primary: #2563eb;
  --primary-soft: #dbeafe;
  --success: #059669;
  --warning: #d97706;
  --danger: #dc2626;
  --shadow: 0 12px 30px rgba(15, 23, 42, .08);
  --radius: 18px;
}
body.dark {
  --bg: #0b1220;
  --surface: #121b2b;
  --surface-2: #1a2639;
  --text: #f5f7fb;
  --muted: #a9b4c3;
  --border: #26364d;
  --primary: #60a5fa;
  --primary-soft: #19345e;
  --shadow: 0 12px 30px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 270px 1fr; }
.sidebar {
  position: sticky; top: 0; height: 100vh; background: #0f172a; color: #fff;
  padding: 24px 18px; display: flex; flex-direction: column; z-index: 20;
}
.brand { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; }
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
  font-weight: 800; font-size: 22px; background: linear-gradient(135deg,#3b82f6,#8b5cf6);
}
.brand h1 { font-size: 18px; margin: 0; }
.brand span { color: #9ca3af; font-size: 12px; }
.nav-list { display: grid; gap: 7px; }
.nav-item {
  border: 0; background: transparent; color: #cbd5e1; border-radius: 12px;
  padding: 12px 14px; text-align: left; display: flex; gap: 12px; align-items: center;
}
.nav-item:hover, .nav-item.active { background: rgba(255,255,255,.1); color: #fff; }
.sidebar-footer { margin-top: auto; }
.storage-status { padding: 14px; border-radius: 14px; background: rgba(255,255,255,.08); display: grid; gap: 4px; }
.storage-status span { color: #94a3b8; font-size: 12px; }
.main { min-width: 0; }
.topbar {
  min-height: 84px; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); z-index: 15; border-bottom: 1px solid var(--border);
}
.topbar h2 { margin: 2px 0 0; font-size: 25px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 13px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn, .primary-btn, .secondary-btn, .danger-btn {
  border: 0; border-radius: 12px; min-height: 42px; padding: 0 15px;
}
.icon-btn { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.primary-btn { background: var(--primary); color: white; font-weight: 700; }
.secondary-btn { background: var(--surface-2); color: var(--text); }
.danger-btn { background: #fee2e2; color: #991b1b; }
.view { display: none; padding: 28px; }
.view.active { display: block; }
.grid { display: grid; gap: 18px; }
.grid.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 14px; }
.kpi-card .kpi-label { color: var(--muted); font-size: 13px; }
.kpi-card .kpi-value { font-size: 30px; font-weight: 800; margin: 10px 0 4px; }
.kpi-card .kpi-foot { font-size: 12px; color: var(--muted); }
.section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
.section-head h3 { margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.list { display: grid; gap: 10px; }
.list-item {
  border: 1px solid var(--border); border-radius: 14px; padding: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.list-item-main { min-width: 0; }
.list-item h4 { margin: 0 0 5px; font-size: 15px; }
.list-item p { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 700; }
.badge.open { background: #dbeafe; color: #1d4ed8; }
.badge.done { background: #d1fae5; color: #047857; }
.badge.pending { background: #fef3c7; color: #92400e; }
.badge.high { background: #fee2e2; color: #991b1b; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.action-btn { border: 0; border-radius: 9px; padding: 7px 9px; background: var(--surface-2); color: var(--text); }
.progress { height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.form-grid { display: grid; gap: 14px; }
.form-row { display: grid; gap: 6px; }
.form-row label { font-size: 13px; font-weight: 700; }
input, select, textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 11px;
  background: var(--surface); color: var(--text); padding: 11px 12px;
}
textarea { min-height: 110px; resize: vertical; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.table-wrap { overflow-x: auto; }
.chart {
  height: 220px; display: flex; align-items: end; gap: 12px; padding-top: 20px;
}
.bar-wrap { flex: 1; display: grid; gap: 8px; align-items: end; height: 100%; }
.bar { background: var(--primary); border-radius: 8px 8px 3px 3px; min-height: 4px; }
.bar-label { text-align: center; color: var(--muted); font-size: 11px; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(2,6,23,.62); display: grid; place-items: center;
  padding: 20px; z-index: 100;
}
.hidden { display: none !important; }
.modal {
  width: min(680px, 100%); max-height: 92vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
}
.modal-header { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.modal-header h3 { margin: 0; }
.modal-body { padding: 20px; display: grid; gap: 14px; }
.toast {
  position: fixed; right: 22px; bottom: 22px; background: #111827; color: white;
  padding: 13px 16px; border-radius: 12px; z-index: 200; box-shadow: var(--shadow);
}
.mobile-only { display: none; }
.hero {
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  color: white; border-radius: 22px; padding: 26px; margin-bottom: 18px;
}
.hero h3 { font-size: 28px; margin: 0 0 8px; }
.hero p { margin: 0; color: rgba(255,255,255,.82); }
.quick-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 18px; }
.quick-card { background: rgba(255,255,255,.14); padding: 14px; border-radius: 14px; }
.quick-card strong { display: block; font-size: 22px; }
.settings-actions { display: flex; flex-wrap: wrap; gap: 10px; }
@media (max-width: 1050px) {
  .grid.kpis { grid-template-columns: repeat(2,1fr); }
  .grid.three { grid-template-columns: 1fr 1fr; }
  .quick-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 780px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: -290px; width: 270px; transition: .25s ease; box-shadow: 18px 0 40px rgba(0,0,0,.3);
  }
  .sidebar.open { left: 0; }
  .mobile-only { display: inline-flex; align-items: center; justify-content: center; }
  .topbar { padding: 14px 16px; }
  .view { padding: 16px; }
  .grid.two, .grid.three { grid-template-columns: 1fr; }
  .primary-btn { padding: 0 11px; }
}
@media (max-width: 520px) {
  .grid.kpis { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: 1fr 1fr; }
  .topbar h2 { font-size: 20px; }
  .topbar-actions .primary-btn { font-size: 0; width: 44px; padding: 0; }
  .topbar-actions .primary-btn::after { content: "＋"; font-size: 22px; }
  .list-item { align-items: flex-start; flex-direction: column; }
}

.mobile-bottom-nav { display:none; }
@media (max-width: 780px) {
  body { padding-bottom: 78px; }
  .mobile-bottom-nav {
    position: fixed; z-index: 60; left: 10px; right: 10px; bottom: 10px;
    height: 66px; display: grid; grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
    backdrop-filter: blur(18px); padding: 6px;
  }
  .mobile-nav {
    border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; align-content: center; gap: 2px;
    border-radius: 14px; min-width: 0;
  }
  .mobile-nav span { font-size: 20px; line-height: 1; }
  .mobile-nav small { font-size: 10px; font-weight: 700; }
  .mobile-nav.active { color: var(--primary); background: var(--primary-soft); }
  .topbar { min-height: 74px; }
  .hero { padding: 22px; border-radius: 20px; }
  .hero h3 { font-size: 24px; }
  .card { border-radius: 16px; padding: 16px; }
}

/* Accent-only color themes. Neutral colors, text, semantic statuses and layout are unchanged. */
:root{
 --accent-button:#2563eb; --accent-glow:rgba(37,99,235,.12);
 --neon-brand-a:#5573F2; --neon-brand-b:#6F65EF;
 --neon-hero-a:#1d4ed8; --neon-hero-b:#7c3aed;
}
.brand-mark{background:linear-gradient(135deg,var(--neon-brand-a),var(--neon-brand-b));box-shadow:0 6px 18px rgba(0,0,0,.16);}
.hero{background:linear-gradient(135deg,var(--neon-hero-a),var(--neon-hero-b));}
.primary-btn{background:var(--accent-button);}
.mobile-nav.active{box-shadow:inset 0 0 0 1px var(--accent-glow);}
.theme-controls{display:grid;gap:18px;margin-top:15px;}
.theme-control-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px;}
.theme-control-head strong{font-size:13px;}
.theme-control-head small{font-size:12px;color:var(--muted);}
.theme-colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
.theme-color-option{
 border:1px solid var(--border);border-radius:13px;min-width:0;min-height:80px;
 background:var(--surface);color:var(--text);display:grid;align-content:center;
 justify-items:center;gap:8px;font-size:12px;font-weight:650;padding:11px 7px;
}
.theme-color-option:hover,.theme-mode-option:hover{border-color:var(--primary);}
.theme-color-option[aria-pressed="true"],.theme-mode-option[aria-pressed="true"]{

/* v2.5.2 — Unified layout rhythm / RTL-LTR symmetry across the entire application.
   Accent palettes, backgrounds and application behavior intentionally stay unchanged. */
:root{--ui-space:16px;--ui-small-space:10px;--ui-control-height:42px}
.view,.main,.grid,.bi-grid,.bi-compare-grid,.bi-stat-grid{min-width:0}
.card,.bi-card,.bi-stat,.bi-compare-tile,.quick-card{min-width:0;box-sizing:border-box}
.card h3,.bi-card h3,.bi-section-title h3{line-height:1.4;overflow-wrap:anywhere}
.card p,.bi-card p,.bi-section-title p{overflow-wrap:anywhere}
button,select,input,textarea{min-width:0;max-width:100%}
.primary-btn,.secondary-btn,.danger-btn,.icon-btn,.lang-btn{min-height:var(--ui-control-height)}
.section-head,.bi-card-head,.bi-section-title,.bi-intro{direction:inherit}
.section-head>*,.bi-card-head>*,.bi-section-title>*,.bi-intro>*{min-width:0}
.grid.kpis,.grid.two,.grid.three,.bi-stat-grid,.bi-compare-grid{align-items:stretch}
/* Dashboard headline: all four values and labels occupy identical rows. */
.quick-grid{align-items:stretch;grid-auto-rows:1fr}
.quick-card{display:grid;grid-template-rows:minmax(34px,auto) minmax(2.85em,auto);align-content:stretch;align-items:end;gap:6px;padding:14px;line-height:1.35;text-align:start}
.quick-card strong{display:block;margin:0;width:100%;font-size:clamp(16px,1.9vw,22px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;align-self:end;overflow-wrap:anywhere;text-align:start;direction:inherit}
.quick-card > span{display:block;width:100%;align-self:start;line-height:1.4;font-size:14px;min-width:0;text-align:start}
.quick-card .hero-money{font-size:clamp(13px,1.8vw,20px);letter-spacing:-.015em;overflow-wrap:normal;word-break:normal}
.quick-card .hero-money bdi{unicode-bidi:isolate;white-space:normal}
/* Every KPI reserves equal areas for labels, numbers and explanatory text. */
.kpi-card{display:flex;flex-direction:column;gap:5px;min-height:152px}
.kpi-card .kpi-label{line-height:1.5;min-height:2.5em;display:block;overflow-wrap:anywhere}
.kpi-card .kpi-value{line-height:1.25;margin:4px 0 3px;overflow-wrap:anywhere;text-align:start;font-variant-numeric:tabular-nums}
.kpi-card .kpi-foot{line-height:1.5;margin-top:auto;min-height:2.5em;display:block;overflow-wrap:anywhere}
/* BI summary cards have one common vertical hierarchy in every viewport. */
.bi-stat-grid{grid-auto-rows:1fr}
.bi-stat{display:flex;flex-direction:column;gap:6px;min-height:149px}
.bi-stat-head{line-height:1.5;min-height:2.6em;align-items:flex-start}
.bi-stat strong{line-height:1.32;margin:2px 0;min-height:1.4em;text-align:start}
.bi-stat small{display:block;line-height:1.5;margin-top:auto;min-height:2.7em;overflow-wrap:anywhere;text-align:start}
.bi-compare-grid{grid-auto-rows:1fr}
.bi-compare-tile{display:flex;flex-direction:column;gap:4px;min-height:171px}
.bi-compare-name{line-height:1.45;min-height:2.75em}
.bi-compare-total{line-height:1.3;margin:0 0 4px;text-align:start;min-height:1.4em}
.bi-compare-change{align-self:flex-start;max-width:100%;min-height:27px}
.bi-compare-desc{margin:auto 0 0;min-height:2.8em;line-height:1.5}
.bi-duo-track{width:100%}
/* Financial values keep internal LTR number ordering, while the outer alignment follows the page. */
body.arabic .bi-stat strong,body.arabic .bi-compare-total,body.arabic .bi-mini-total,body.arabic .bi-entry-amount,body.arabic .bi-cat-value,body.arabic .bi-category-head small{text-align:right}
body:not(.arabic) .bi-stat strong,body:not(.arabic) .bi-compare-total,body:not(.arabic) .bi-mini-total,body:not(.arabic) .bi-entry-amount,body:not(.arabic) .bi-cat-value{text-align:left}
/* Consistent chart title bars, spacing, legends and detail rows. */
.bi-card{display:flex;flex-direction:column}
.bi-card-head{min-height:59px;align-items:flex-start;gap:12px}
.bi-card-head h3{line-height:1.4}
.bi-card-head .bi-pill,.bi-card-head .bi-metric-select{flex-shrink:0}
.bi-grid>.bi-card{height:100%}
.bi-legend,.bi-split-legend{row-gap:8px;line-height:1.5}
.bi-stat,.bi-compare-tile,.bi-insight-note,.bi-card,.card{scroll-margin-top:100px}
.bi-insight-note{min-width:0}
.bi-progress-label,.bi-category-head,.bi-detail-head,.bi-entry{min-width:0}
.bi-category-head>strong{overflow-wrap:anywhere}
.bi-selected-ledger{max-width:100%}
.bi-sheet-scroll,.bi-scroll{overscroll-behavior-x:contain}
/* Consistent column widths and touch targets for lists and settings. */

/* Reminders & notifications card */
.notify-card{margin-top:18px}
.notify-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notify-head h3{margin:0}
.notify-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.notify-status.ok{background:color-mix(in srgb,#22c55e 16%,transparent);color:#16a34a}
.notify-status.warn{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#b45309}
body.dark .notify-status.ok{color:#4ade80}
body.dark .notify-status.warn{color:#fbbf24}
.notify-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.notify-row:first-of-type{border-top:0}
.notify-row .notify-text{display:grid;gap:3px;min-width:0}
.notify-row .notify-text strong{font-size:14px}
.notify-row .notify-text small{color:var(--muted);font-size:12px;line-height:1.5}
.notify-controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.notify-controls select,.notify-controls input[type=time]{width:auto;min-width:0;height:38px;padding:0 9px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
.notify-controls select:disabled,.notify-controls input:disabled{opacity:.45}
.switch{position:relative;display:inline-block;width:46px;height:27px;flex-shrink:0}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--accent-button,var(--primary))}
.switch input:checked+span::after{transform:translateX(19px)}
body.arabic .switch input:checked+span::after{transform:translateX(-19px)}
.switch input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.notify-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.notify-note{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.notify-sub{opacity:1;transition:opacity .2s}
.notify-sub.off{opacity:.5}
@media(max-width:520px){.notify-row{align-items:flex-start}.notify-controls{flex-direction:column-reverse;align-items:flex-end;gap:8px}}

.link-btn{background:none;border:0;padding:0;color:var(--primary);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

.prayer-row.next .prayer-nm,.prayer-row.next .prayer-tm{color:var(--primary)}
.prayer-row.past{opacity:.55}
.prayer-bell{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:16px;cursor:pointer}
.prayer-bell.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--surface))}
.prayer-audio{margin-top:14px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}

/* ---- Quran (Madinah Mushaf) ---- */

.quran-modes{flex:1;display:flex;border:1px solid var(--border);border-radius:11px;overflow:hidden}

.mushaf-stage{display:flex;justify-content:center;touch-action:pan-y;overflow:hidden}
/* Swipe mode: the whole page fits on the phone screen (between the top bar, toolbar and bottom menu). */
.mushaf-stage{min-height:calc(100vh - 110px);padding:7px 7px 18px}.mushaf-stage .mushaf-page{--mw:min(100%,620px,max(300px,calc((100vh - 120px) * 0.66)))}@media (max-width:780px){.mushaf-stage{min-height:calc(100vh - 200px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}.mushaf-stage .mushaf-page{--mw:min(100%,620px,max(300px,calc((100vh - 236px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 0.66)))}}
.mushaf-page{--mw:min(100%,560px);width:var(--mw);aspect-ratio:0.66;container-type:inline-size;margin:0 auto 14px;
 background:#fffdf6;color:#1a1a1a;border-radius:10px;padding:3.2% 4.4% 2.6%;box-sizing:border-box;display:flex;flex-direction:column;
 box-shadow:0 0 0 1px #e2d7b5,0 0 0 5px #fffdf6,0 0 0 6px #c9b37a,0 10px 28px rgba(0,0,0,.12)}
body.dark .mushaf-page{background:#15171c;color:#ece6d4;box-shadow:0 0 0 1px #3a3424,0 0 0 5px #15171c,0 0 0 6px #6d5d34,0 10px 28px rgba(0,0,0,.4)}
.mp-head,.mp-foot{display:flex;justify-content:space-between;font-family:'UthmanicHafs',serif;font-size:3.6cqw;color:#6d5d34;direction:rtl}

.mp-foot{justify-content:center;margin-top:1%}
.mp-body{flex:1;display:grid;grid-template-rows:repeat(15,1fr);direction:rtl;font-size:6.4cqw;line-height:1}
.mp-body.mp-opening{grid-template-rows:none;align-content:center;gap:2.4cqw}
.mp-line{display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.mp-opening .mp-line{justify-content:center;gap:1.2cqw}
.mp-surah{justify-content:center;font-family:'UthmanicHafs',serif;font-size:4.4cqw;border:1px solid #c9b37a;border-radius:8px;
 background:linear-gradient(90deg,transparent,rgba(201,179,122,.18),transparent);margin:0 6%}
.mp-basmala{justify-content:center;font-family:'UthmanicHafs',serif;font-size:4.8cqw}
.mushaf-page.mp-wait .mp-body{visibility:hidden}
.mp-in-next{animation:mpNext .28s ease}.mp-in-prev{animation:mpPrev .28s ease}
@keyframes mpNext{from{transform:translateX(-14%);opacity:.2}to{transform:none;opacity:1}}
@keyframes mpPrev{from{transform:translateX(14%);opacity:.2}to{transform:none;opacity:1}}

.quran-fab{position:fixed;z-index:55;inset-inline-start:16px;bottom:calc(24px + env(safe-area-inset-bottom));border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 94%,transparent);color:var(--text);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;box-shadow:var(--shadow);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}

 box-shadow:inset 0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;

.tb-stats{display:flex;gap:12px}
.tb-stat{display:grid;gap:2px;text-align:center;padding:10px 18px;border-radius:14px;background:var(--surface-2);min-width:96px}
.tb-stat span{font-size:12.5px;color:var(--muted)}
.tb-stat b{font-size:20px}

/* ---- Groceries ---- */
.gr-input{display:grid;gap:12px;margin-bottom:14px}
.gr-head{display:grid;gap:2px}.gr-head h3{margin:0;font-size:19px}
#grocIn{width:100%;box-sizing:border-box;min-height:92px;resize:vertical;border:1.5px dashed var(--border);border-radius:14px;padding:12px 14px;
 font:inherit;font-size:16px;line-height:1.7;background:var(--surface-2);color:var(--text)}
#grocIn:focus{outline:none;border-color:var(--primary);border-style:solid;background:var(--surface)}
.gr-actions{display:grid;grid-template-columns:auto 1fr;gap:10px}
.gr-listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.gr-listhead b{font-size:17px}
.gr-count{font-size:13.5px;color:var(--muted);font-weight:700}
.gr-bar{margin-bottom:6px}
.gr-list{list-style:none;margin:0;padding:0}
.gr-item{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border)}
.gr-item:last-child{border-bottom:0}
.gr-row{flex:1;display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 2px;border:0;background:none;color:var(--text);font:inherit;
 font-size:17px;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gr-box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid;border-color:color-mix(in srgb,var(--muted) 75%,var(--surface));display:grid;place-items:center;
 font-size:15px;font-weight:900;color:#fff;transition:background .15s,border-color .15s,transform .15s}
.gr-t{flex:1;overflow-wrap:anywhere;transition:color .15s}
.gr-item.done .gr-box{background:var(--primary);border-color:var(--primary);transform:scale(1.05)}
.gr-item.done .gr-t{text-decoration:line-through;color:var(--muted)}
.gr-del{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:14px;cursor:pointer;opacity:.55}
.gr-del:hover,.gr-del:focus-visible{opacity:1;background:var(--surface-2)}
.gr-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gr-tools .secondary-btn{font-size:14px}
.gr-danger{color:var(--danger)}
.gr-empty{text-align:center;color:var(--muted);padding:26px 10px}

/* ---- Travel ---- */
.tv-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tv-hero-t{font-size:21px;font-weight:800}
.tv-trips{display:grid;gap:10px;margin-bottom:14px}
.tv-trip{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:18px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.tv-trip.past{opacity:.6}
.tv-trip-f{font-size:26px;flex:none;max-width:80px;line-height:1.2}
.tv-trip-m{flex:1;display:grid;gap:3px;min-width:0}.tv-trip-m b{font-size:16.5px;overflow-wrap:anywhere}.tv-trip-m span{font-size:13px;color:var(--muted)}
.tv-cd{flex:none;font-size:12.5px;font-weight:800;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tv-empty{text-align:center;color:var(--muted);padding:26px 12px}
.tv-guidecard{display:grid;gap:10px}.tv-guidecard h3{margin:0}
.tv-src{font-size:11.5px;color:var(--muted);text-align:center;margin:10px 0 4px}
.tv-chips{display:flex;flex-wrap:wrap;gap:7px}
.tv-chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tv-chip.on{background:var(--primary-soft);border-color:var(--primary);font-weight:700}
.tv-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tv-top .secondary-btn{flex:none}
.tv-top-sp{flex:1}
.tv-tname{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:0 12px;background:var(--surface-2)}
.tv-tname:focus-within{border-color:var(--primary);background:var(--surface)}
.tv-tname>span{font-size:14px;opacity:.7}
.tv-title{flex:1;min-width:0;font:inherit;font-size:15.5px;font-weight:700;border:0;padding:10px 0;background:transparent;color:var(--text)}
.tv-title:focus{outline:none}
.tv-gt{flex:1;font-size:18px;min-width:0}
.tv-icon{flex:none;width:38px;height:38px;border:0;border-radius:11px;background:none;color:var(--muted);font-size:16px;cursor:pointer}
.tv-icon:hover,.tv-icon:focus-visible{background:var(--surface-2)}
.tv-sum{display:grid;gap:12px;margin-bottom:14px}
.tv-sum-r{font-size:17px;line-height:1.6}
.tv-sum-m{display:flex;flex-wrap:wrap;gap:6px}
.tv-pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text);background:var(--surface-2);border-radius:999px;padding:5px 11px;white-space:nowrap}
.tv-pill.tv-cd{color:var(--primary);background:var(--primary-soft);font-weight:800}
.tv-steps-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding-top:10px;border-top:1px solid var(--border)}
.tv-steps-h span{font-size:13px;color:var(--success);font-weight:800}
.tv-bar{display:block;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.tv-bar i{display:block;height:100%;border-radius:9px;background:var(--success);transition:width .3s}
.tv-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tv-stp{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:8px 2px 7px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;font-weight:700;line-height:1.3;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tv-stp span{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px}
.tv-stp.ok{color:var(--text);border-color:color-mix(in srgb,var(--success) 45%,var(--border))}
.tv-stp.ok span{background:var(--success);color:#fff}
.tv-sec{margin-bottom:14px;display:grid;gap:12px}
.tv-sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tv-sec-h h3{margin:0;font-size:17.5px;flex:1 1 0;min-width:150px;line-height:1.5}
.tv-sec-sub{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
.tv-num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.tv-num.ok{background:var(--success);color:#fff}
.tv-stop{display:grid;gap:10px;padding-bottom:12px;border-bottom:1px dashed var(--border)}
.tv-stop:last-of-type{border-bottom:0}
.tv-stop-h{display:flex;align-items:center;justify-content:space-between}
.tv-row{display:grid;gap:8px;scroll-margin-top:110px}
.tv-row-h{display:flex;align-items:center;gap:8px}
.tv-row-h .tv-lbl{font-size:14.5px;color:var(--text);font-weight:800}
.tv-num.sm{width:24px;height:24px;font-size:12.5px}
.tv-row-b{display:grid;gap:6px;min-width:0}
.tv-lbl{font-size:13px;color:var(--muted);font-weight:700}
.tv-pick{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tv-pick>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.tv-pick.empty{border-style:dashed}
.tv-ph{color:var(--muted)}.tv-dis{padding:10px 2px;font-size:14px}
.tv-chev{flex:none;color:var(--muted);font-size:20px;line-height:1}
[dir="rtl"] .tv-chev{transform:scaleX(-1)}
.tv-addstop{justify-self:start}
.tv-f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
.tv-f input,.tv-f select,.tv-f textarea{font:inherit;font-size:16px;font-weight:400;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;box-sizing:border-box}
.tv-f textarea{resize:vertical;line-height:1.6}
.tv-f input:focus,.tv-f select:focus,.tv-f textarea:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.tv-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tv-wide{grid-column:1/-1}
.tv-nights{max-width:220px}
.tv-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.tv-seg button{border:0;border-radius:11px;padding:10px 4px;background:none;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.tv-seg button.on{background:var(--surface);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--primary)}
.tv-dline{font-size:14px;color:var(--text);background:var(--surface-2);border-radius:12px;padding:10px 12px;line-height:1.7}
.tv-isl{display:grid;gap:8px}
.tv-isl>div{border-radius:12px;padding:10px 12px;background:var(--surface-2);border-inline-start:4px solid var(--warning)}
.tv-step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.tv-step>div:first-child{display:grid;gap:2px}
.tv-step-c{display:flex;align-items:center;gap:6px}
.tv-step-c button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:20px;cursor:pointer;touch-action:manipulation}
.tv-step-c button:disabled{opacity:.35;cursor:default}
.tv-step-c output{min-width:30px;text-align:center;font-size:18px;font-weight:800}
.tv-ages{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid var(--border)}
.tv-age{display:flex;align-items:center;gap:6px;font-size:13.5px}
.tv-age select{font:inherit;font-size:15px;border:1px solid var(--border);border-radius:10px;padding:6px;background:var(--surface-2);color:var(--text)}
.tv-leg{border:1px solid var(--border);border-radius:14px;padding:4px 12px 12px}
.tv-leg summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;cursor:pointer;list-style:none}
.tv-leg summary::-webkit-details-marker{display:none}
.tv-leg summary .hint{flex-basis:100%;order:3}
.tv-leg-sel{margin-inline-start:auto;font-size:18px}
.tv-trg{display:grid;gap:6px;margin-bottom:10px}
.tv-trg-h{font-size:12px;color:var(--muted);font-weight:700}
.tv-stay{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px dashed var(--border)}
.tv-stay:last-child{border-bottom:0;padding-bottom:0}
.tv-stay-h{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tv-tag{font-size:12.5px;font-weight:700;background:var(--primary-soft);color:var(--text);border-radius:999px;padding:3px 9px}
.tv-stars{display:flex;gap:4px}
.tv-stars button{border:0;background:none;font-size:26px;color:var(--border);cursor:pointer;padding:0 2px;line-height:1}
.tv-stars button.on{color:#f5b301}
.tv-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tv-facts>div{background:var(--surface-2);border-radius:12px;padding:9px 11px;display:grid;gap:3px}
.tv-facts span{font-size:12px;color:var(--muted)}.tv-facts b{font-size:14.5px;overflow-wrap:anywhere}
.tv-info{display:grid;gap:10px}
.tv-sub{font-weight:800;font-size:15px;margin-top:6px}
.tv-months{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.tv-months span{text-align:center;font-size:12px;padding:7px 2px;border-radius:9px;background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.tv-months span.best{background:color-mix(in srgb,var(--success) 22%,var(--surface));color:var(--text);font-weight:700}
.tv-months span.trip{border-color:var(--primary)}
.tv-legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.tv-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.tv-legend i.best{background:color-mix(in srgb,var(--success) 40%,var(--surface))}
.tv-legend i.trip{border:2px solid;border-color:var(--primary)}
.tv-ok-line{font-size:14px;font-weight:700;color:var(--success)}
.tv-ok-line.mid{color:var(--warning)}.tv-ok-line.no{color:var(--danger)}
.tv-clim{margin:0;line-height:1.8;font-size:14.5px}
.tv-ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.tv-ev>div{flex:1;display:grid;gap:3px;min-width:0}
.tv-ev b{font-size:15px}
.tv-ev.on b{color:var(--primary)}
.tv-star{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--surface-2);font-size:20px;color:var(--muted);cursor:pointer}
.tv-star.on{color:#f5b301}
.tv-more summary{cursor:pointer;font-weight:800;font-size:15px;padding:6px 0}
.tv-tips{margin:0;padding-inline-start:20px;display:grid;gap:6px;line-height:1.7;font-size:14.5px}
.tv-note{font-size:12px;color:var(--muted)}
.tv-none{padding:4px 0}
.tv-cinfo{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px dashed var(--border)}
.tv-act{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.tv-act .tv-icon{margin-inline-start:auto;width:32px;height:32px;font-size:13px}
.tv-actadd{display:grid;grid-template-columns:1fr auto;gap:6px}
.tv-actadd #tvActIn{grid-column:1/-1}
.tv-actadd input{font:inherit;font-size:15px;min-width:0;border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:var(--surface-2);color:var(--text)}
.tv-actadd input[type=date]{width:100%}
.tv-age span{white-space:nowrap}
.tv-sheet-back{position:fixed;inset:0;z-index:1200;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center}
.tv-sheet-back.hidden{display:none}
.tv-sheet{width:min(640px,100%);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;gap:8px;background:var(--surface);color:var(--text);border-radius:22px 22px 0 0;padding:14px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.tv-sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16.5px}
#tvSheetQ{font:inherit;font-size:16px;border:1px solid var(--border);border-radius:14px;padding:11px 14px;background:var(--surface-2);color:var(--text);width:100%;box-sizing:border-box}
#tvSheetQ:focus{outline:none;border-color:var(--primary)}
.tv-sheet-nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted)}
.tv-sheet-nav.hidden{display:none}
.tv-sheet-res{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:160px;flex:1;overscroll-behavior:contain}
.tv-sheet-sec{font-size:12px;color:var(--muted);font-weight:700;padding:6px 2px}
.tv-res{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 6px;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);font:inherit;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tv-res:active{background:var(--surface-2)}
.tv-res-m{flex:1;display:grid;gap:2px;min-width:0}.tv-res-m b{font-size:15.5px;font-weight:700}
.tv-res-m .hint{font-size:12.5px}
.tv-flag{font-size:22px;margin-inline-end:8px}
.tv-res-m:has(.tv-flag){display:flex;align-items:center}
.tv-badge{flex:none;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 8px}
.tv-custom{color:var(--primary);font-weight:700}
.tv-approx .tv-res-m b::after{content:' ≈';color:var(--muted);font-weight:400}
.tv-all{color:var(--success)}

/* iPhone home-screen app: keep content clear of the notch / Dynamic Island and the home bar. */
@supports (padding: env(safe-area-inset-top)) {
 .topbar { border-top: env(safe-area-inset-top) solid transparent; }
 .sidebar { padding-top: calc(24px + env(safe-area-inset-top)); }
 @media (max-width: 780px) {
  body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  .mobile-bottom-nav { bottom: calc(10px + env(safe-area-inset-bottom)); }
 }
}
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
</style>

function normalize(input){
 const data=(input && typeof input==='object' && !Array.isArray(input))?input:{};

}
let storageEnabled=true;

function actions(type,x){return `<div class="actions">${btn(tr('تعديل','Edit'),'edit',type,x.id,'action-btn')}${btn(tr('حذف','Delete'),'delete',type,x.id,'action-btn danger-inline')}</div>`;}
function dateNote(s){return s?dateLabel(s):tr('لم يُحدد','Not set');}

function cardRoutine(x){const done=!!x.done,late=isOverdue(x.date,done);return `<div class="list-item ${done?'completed':''}" data-search="${safe([x.title,x.category,x.date].join(' ').toLowerCase())}"><button type="button" class="check-toggle ${done?'checked':''}" data-action="toggleRoutine" data-type="routine" data-id="${safe(x.id)}" aria-label="${done?tr('إعادة فتح المهمة','Mark not done'):tr('إكمال المهمة','Mark complete')}" aria-pressed="${done}">${done?'✓':''}</button><div class="list-item-main grow"><h4>${safe(x.title)}</h4><p>🗓 ${dateNote(x.date)} ${x.time?'· '+safe(x.time):''} · ${safe(term(x.category||'Routine'))}</p></div><span class="badge ${done?'done':late?'high':'pending'}">${done?tr('مكتملة','Done'):late?tr('متأخرة','Overdue'):tr('قيد التنفيذ','To do')}</span>${actions('routine',x)}</div>`;}

 return `<div class="card bi-mini-card"><div class="bi-mini"><div><div class="bi-mini-title">📊 ${tr('لمحة من تحليلاتك','Your insights')}</div><div class="bi-mini-label">${tr('مصروف آخر 6 أشهر','Expenses · last 6 months')}</div><div class="bi-mini-total">${has?safe(money(vals.reduce((a,b)=>a+b,0))):'—'}</div></div><svg class="bi-mini-spark" viewBox="0 0 160 50" role="img" aria-label="${tr('ملخص بصري للمصروفات','Spending sparkline')}">${has?`<path d="${vals.map((v,i)=>`${i===0?'M':'L'}${6+i*29.6} ${42-v/max*34}`).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${6+i*29.6}" cy="${42-v/max*34}" r="3" fill="var(--primary)"/>`).join('')}`:`<line x1="0" x2="155" y1="40" y2="40" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>`}</svg></div><button type="button" class="bi-link" data-action="go" data-type="reports">${tr('عرض لوحة التحليلات','Open analytics dashboard')} ↗</button></div>`;}

// Additional BI panels. Periods use calendar months; the current month is partial.
function biPreviousMonths(months){const oldest=months[0];const [yy,mm]=oldest.split('-').map(Number);return Array.from({length:months.length},(_,i)=>{const d=new Date(yy,mm-1-months.length+i,1);return dateLocal(d).slice(0,7);});}
function biTotals(sums){return sums.reduce((a,m)=>({income:a.income+m.income,expense:a.expense+m.expense,net:a.net+m.net}),{income:0,expense:0,net:0});}
function biChange(current,previous){if(previous===0)return null;return (current-previous)/Math.abs(previous)*100;}
function biComparePeriods(now,prior){const n=biTotals(now),p=biTotals(prior);
 const cols=[['income',tr('الدخل','Income'),'#10b981',true],['expense',tr('المصروفات','Spending'),'#ef7777',false],['net',tr('صافي التدفق','Net cash flow'),'var(--primary)',true]];
 return `<div class="bi-compare-grid">${cols.map(([k,label,color,positive])=>{const a=n[k],b=p[k],change=biChange(a,b);const cls=change===null?'':Math.abs(change)<.05?'':(change>0)===positive?'good':'bad';const arrow=change===null?'—':`${change>0?'↑':change<0?'↓':'→'} ${Math.abs(change).toFixed(1)}%`;
 const max=Math.max(Math.abs(a),Math.abs(b),1);return `<div class="bi-compare-tile"><div class="bi-compare-name">${label}</div><div class="bi-compare-total">${safe(money(a))}</div><span class="bi-compare-change ${cls}">${safe(arrow)}</span><p class="bi-compare-desc">${tr('الفترة السابقة','Previous period')}: <strong dir="ltr">${safe(money(b))}</strong></p><div class="bi-duo-track" aria-hidden="true"><span class="bi-duo-current" style="background:${color};width:${(Math.abs(a)/max*100).toFixed(2)}%"></span><span class="bi-duo-previous" style="width:${(Math.abs(b)/max*100).toFixed(2)}%"></span></div>${change===null?`<p class="bi-help-line">${tr('لا توجد قيمة سابقة مناسبة لحساب النسبة.','No usable previous value for a percentage change.')}</p>`:''}</div>`;}).join('')}</div>`;}
function biSmartInsights(current,prior,categories){const n=biTotals(current),p=biTotals(prior),total=state.finance.filter(x=>Number(x.amount)>0).length;
 if(!total)return `<div class="bi-insight-note"><span class="glyph">📝</span><div><strong>${tr('اللوحة جاهزة','Your dashboard is ready')}</strong><p>${tr('ابدأ بتسجيل معاملاتك في المالية لتظهر المقارنات والاستنتاجات المبنية على بياناتك.','Add financial transactions to see meaningful comparisons and insights.')}</p></div></div>`;
 const items=[];
 if(n.income>0){const rate=n.net/n.income*100;items.push(['💰',tr('نسبة صافي التدفق','Net cash-flow ratio'),tr('صافي التدفق يساوي ','Net cash flow represents ')+`${rate.toFixed(1)}%`+tr(' من الدخل المسجّل في الفترة.',' of recorded income during the period.')]);}
 if(p.expense>0){const d=biChange(n.expense,p.expense);items.push([d<=0?'📉':'📈',tr('حركة الإنفاق','Spending movement'),d===0?tr('الإنفاق لم يتغير عن الفترة السابقة.','Spending is unchanged from the previous period.'):Math.abs(d).toFixed(1)+'% · '+(d<0?tr('انخفض الإنفاق عن الفترة السابقة.','Spending decreased versus the previous period.'):tr('ارتفع الإنفاق عن الفترة السابقة.','Spending increased versus the previous period.'))]);}
 const top=[...categories.entries()].sort((a,b)=>b[1]-a[1])[0];if(top && n.expense>0){items.push(['🎯',tr('أكبر بند مصروفات','Largest expense category'),`${tr('الفئة','Category')}: ${term(top[0])} · ${(top[1]/n.expense*100).toFixed(1)}% ${tr('من إنفاق الفترة.','of period spending.')}`]);}
 if(!items.length)items.push(['📊',tr('البيانات المسجلة','Recorded data'),tr('أضف المزيد من العمليات في الفترات الحالية والسابقة لتحسين المقارنة.','Add more records to current and previous periods for richer comparisons.')]);
 return `<div class="bi-insight-row">${items.slice(0,4).map(([icon,title,desc])=>`<div class="bi-insight-note"><span class="glyph">${icon}</span><div><strong>${safe(title)}</strong><p>${safe(desc)}</p></div></div>`).join('')}</div>`;}
function biCategoryComparison(current,prior){const categories=[...new Set([...current.keys(),...prior.keys()])].map(k=>({key:k,now:current.get(k)||0,prev:prior.get(k)||0})).filter(x=>x.now>0||x.prev>0).sort((a,b)=>(b.now+b.prev)-(a.now+a.prev)).slice(0,6);
 if(!categories.length)return biEmpty(tr('أضف مصروفات لتظهر مقارنة فئات الإنفاق.','Add spending transactions to compare categories.'));
 const max=Math.max(1,...categories.flatMap(x=>[x.now,x.prev]));return `<div class="bi-split-legend"><span><i style="background:var(--primary)"></i>${tr('الفترة الحالية','Current period')}</span><span><i style="background:#bcc5d6"></i>${tr('الفترة السابقة','Previous period')}</span></div><div class="bi-category-rows">${categories.map(x=>`<div><div class="bi-category-head"><strong title="${safe(term(x.key))}">${safe(term(x.key))}</strong><small>${safe(biNumber(x.now))} / ${safe(biNumber(x.prev))}</small></div><div class="bi-cat-duo"><div class="bi-cat-track"><span class="bi-cat-bar" style="background:var(--primary);width:${(x.now/max*100).toFixed(1)}%"></span></div><div class="bi-cat-track"><span class="bi-cat-bar" style="background:#bcc5d6;width:${(x.prev/max*100).toFixed(1)}%"></span></div></div></div>`).join('')}</div>`;}
function biMonthlyLedger(sums){if(!sums.some(x=>x.income>0||x.expense>0))return biEmpty(tr('سيظهر السجل الشهري بعد إضافة معاملات مالية.','Your monthly breakdown appears when you add transactions.'));
 if(biSelectedMonth && !sums.some(x=>x.month===biSelectedMonth))biSelectedMonth=null;
 const months=[...sums].reverse();const rows=months.map(x=>{const tx=state.finance.filter(t=>String(t.date||'').slice(0,7)===x.month && Number(t.amount)>0 && ['Income','Expense'].includes(t.type));const rate=x.income>0?(x.net/x.income*100).toFixed(1)+'%':'—';return `<tr data-action="biMonth" data-bi-month="${safe(x.month)}" aria-selected="${biSelectedMonth===x.month}"><td><button type="button" data-action="biMonth" data-bi-month="${safe(x.month)}">${safe(x.month)}</button></td><td dir="ltr">${safe(money(x.income))}</td><td dir="ltr">${safe(money(x.expense))}</td><td dir="ltr" class="${x.net<0?'bi-negative':'bi-positive'}">${safe(money(x.net))}</td><td dir="ltr">${rate}</td><td class="bi-transaction-count">${tx.length}</td></tr>`;}).join('');
 const details=biSelectedMonth?biMonthTransactions(biSelectedMonth):'';
 return `<div class="bi-sheet"><div class="bi-sheet-scroll"><table class="bi-ledger"><thead><tr><th>${tr('الشهر','Month')}</th><th>${tr('الدخل','Income')}</th><th>${tr('المصروف','Spending')}</th><th>${tr('الصافي','Net')}</th><th>${tr('معدل الصافي','Net ratio')}</th><th>${tr('العمليات','Entries')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>${details}`;}
function biMonthTransactions(month){const tx=state.finance.filter(t=>String(t.date||'').slice(0,7)===month && Number(t.amount)>0 && ['Income','Expense'].includes(t.type)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const max=12;
 return `<div class="bi-selected-ledger"><div class="bi-detail-head"><span>📅 ${safe(month)} · ${tx.length} ${tr('عملية','entries')}</span><button type="button" class="bi-link" data-action="biMonth" data-bi-month="" style="margin:0">${tr('إغلاق','Close')} ×</button></div>${tx.length?tx.slice(0,max).map(x=>`<div class="bi-entry"><span class="bi-entry-text"><span>${safe(x.note||term(x.category)||term(x.type))}</span><small>${safe(dateLabel(x.date))} · ${safe(term(x.category))}</small></span><span class="bi-entry-amount ${x.type==='Expense'?'bi-negative':'bi-positive'}" dir="ltr">${x.type==='Expense'?'−':'+'}${safe(money(x.amount))}</span></div>`).join(''):biEmpty(tr('لا توجد عمليات في هذا الشهر.','No transactions in this month.'))}${tx.length>max?`<p class="bi-help-line">${tr('يعرض أحدث 12 عملية من أصل','Showing the latest 12 of')} ${tx.length}</p>`:''}</div>`;}
function biWeekActivity(){const start=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()-i);const day=dateLocal(d),entries=state.routines.filter(x=>x.date===day),done=entries.filter(x=>x.done).length;days.push({day,total:entries.length,done});}
 if(!days.some(x=>x.total))return biEmpty(tr('أضف مهام بتاريخ خلال آخر 7 أيام لتظهر المتابعة اليومية.','Record dated daily tasks in the last seven days to see activity.'));
 const max=Math.max(1,...days.map(x=>x.total));return `<div class="bi-week-bars" role="img" aria-label="${tr('المهام المكتملة والمجدولة لآخر 7 أيام','Completed and scheduled tasks over the last seven days')}">${days.map(x=>{const lab=x.day.slice(5),rate=x.total?Math.round(x.done/x.total*100):0;return `<div class="bi-week-day" title="${safe(x.day+' · '+x.done+'/'+x.total)}"><span class="bi-week-ratio" dir="ltr">${x.done}/${x.total}</span><div class="bi-week-bar"><span class="bi-week-filled" style="height:${x.total?Math.max(5,x.done/max*100):0}%"></span></div><span class="bi-week-label" dir="ltr">${lab}</span></div>`;}).join('')}</div><p class="bi-help-line">${tr('الأرقام حسب تاريخ المهمة وحالتها الحالية، وليست سجلًا تاريخيًا لوقت إكمالها.','Based on task date and current completion status, not historical completion timestamps.')}</p>`;}
function biWorkSnapshot(){const tasks=state.work,done=tasks.filter(x=>x.status==='Done').length,pending=tasks.filter(x=>x.status==='Pending').length,open=tasks.length-done-pending;const overdue=tasks.filter(x=>x.status!=='Done'&&x.due&&x.due<dateLocal()).length,urgent=tasks.filter(x=>x.status!=='Done'&&x.priority==='High').length;
 if(!tasks.length)return biEmpty(tr('سجّل مهام العمل لرؤية توزيع الحالات والأولويات.','Add work tasks to see statuses and priorities.'));

seAccent" data-accent="${key}" aria-label="${safe(tr(c.ar,c.en))}" aria-pressed="${state.accent===key}"><span class="theme-color-circle" style="--swatch-a:${c.hero[0]};--swatch-b:${c.hero[1]}"></span><span>${safe(tr(c.ar,c.en))}</span></button>`).join('')}</div></section><section aria-label="${tr('لون الخلفية','Background color')}"><div class="theme-control-head"><strong>${tr('لون الخلفية','Background')}</strong><small>${tr('داكن أو فاتح','Dark or light')}</small></div><div class="theme-modes">${[['dark','أسود','Black','#0b1220','#f5f7fb'],['light','أبيض','White','#f4f7fb','#182230']].map(([mode,ar,en,bg,text])=>`<button type="button" class="theme-mode-option" data-action="chooseMode" data-mode="${mode}" aria-pressed="${state.theme===mode}"><span class="theme-mode-preview" style="--mode-bg:${bg};--mode-text:${text};--mode-start:${COLOR_PRESETS[state.accent].hero[0]};--mode-end:${COLOR_PRESETS[state.accent].hero[1]}"></span><span>${tr(ar,en)}</span></button>`).join('')}</div></section><div class="theme-selection-summary"><span class="theme-color-circle" style="--swatch-a:${COLOR_PRESETS[state.accent].hero[0]};--swatch-b:${COLOR_PRESETS[state.accent].hero[1]}"></span><span>${tr('المظهر المختار:','Selected appearance:')} <strong>${appearanceName()}</strong></span></div></div></div></div><div class="grid two" style="margin-top:18px"><div class="card"><h3>${tr('النسخ الاحتياطي','Backups & data')}</h3><p class="muted">${tr('بياناتك محفوظة محليًا في هذا المتصفح. لا توجد مزامنة سحابية. احفظ نسخة احتياطية خصوصًا قبل تغيير الجهاز أو المتصفح.','Your data is local to this browser. There is no cloud sync. Keep a backup before changing devices or browsers.')}</p><div class="settings-actions">${btn('↓ '+tr('تصدير نسخة','Export backup'),'export','','','secondary-btn')}${btn('↑ '+tr('استيراد نسخة','Import backup'),'import','','','secondary-btn')}</div><p class="hint">${tr('يمكنك استيراد ملف النسخة القديمة من Ramzi Life OS بعد تصديره منها.','You can import a backup exported from the original Ramzi Life OS.')}</p></div><div class="card"><h3>${tr('حذف البيانات','Reset data')}</h3><p class="muted">${tr('تحذير: يمسح جميع السجلات في هذا المتصفح. صدّر نسخة أولًا.','Warning: deletes all entries in this browser. Export first.')}</p>${btn(tr('مسح جميع البيانات','Delete all local data'),'reset','','','danger-btn')}<div class="version">Daily Life OS · v3.3.1 · ${tr('يعمل دون اتصال بعد حفظ الملف','Standalone offline HTML')}</div></div></div>${notifyCard()}`;

function renderView(){
 const renderers={dashboard:renderDashboard,today:renderToday,work:renderWork,education:renderEducation,finance:renderFinance,goals:renderGoals,prayer:renderPrayer,groceries:renderGroceries,travel:renderTravel,quran:renderQuran,adhkar:renderAdhkar,notes:renderNotes,reports:renderReports,settings:renderSettings};renderers[currentView]();applyClientFilter();
}
function renderAll(){updateChrome();renderView();updateStorage();}
function applyClientFilter(){const type={today:'routine',work:'work',education:'education',finance:'finance',goals:'goal',notes:'note'}[currentView];if(!type)return;
 const termText=(searchText[type]||'').toLocaleLowerCase();const container=$(`[data-list="${type}"]`);if(!container)return;const cards=Array.from(container.querySelectorAll('.list-item'));let shown=0;
 for(const card of cards){const matched=(card.dataset.search||'').includes(termText);card.classList.toggle('hidden',!matched);if(matched)shown++;}
 const count=$(`[data-count="${type}"]`);if(count)count.textContent=`${shown} ${tr('عنصر','items')}`;
 const emptyEl=$(`[data-empty-filter="${type}"]`);if(emptyEl)emptyEl.classList.toggle('hidden',shown>0||cards.length===0);
}
function createPicker(){
 editContext={picker:true};lastFocus=document.activeElement;
 $('#modalTitle').textContent=tr('إيش تبغى تضيف؟','What would you like to add?');
 const options=[['routine','📅','مهمة يومية','Daily task'],['work','💼','مهمة عمل','Work task'],['education','📚','دراسة / شهادة','Course / certification'],['finance','💰','عملية مالية','Transaction'],['goal','🎯','هدف','Goal'],['note','📝','ملاحظة','Note']];
 $('#modalForm').innerHTML=`<div class="picker-grid">${options.map(([type,icon,ar,en])=>`<button type="button" class="picker-tile" data-action="add" data-type="${type}"><span>${icon}</span><strong>${tr(ar,en)}</strong></button>`).join('')}</div>`;showModal();
}
function fieldHTML([name,ar,en,type,required,options],item){
 const lbl=tr(ar,en)+(required?' *':'');const defaultValue={date:dateLocal(),progress:'0',priority:'Medium',status:'Open',category:'Other',type:'Expense'};
 const value=item?.[name]??(name==='date'?dateLocal():(defaultValue[name]??''));const idAttribute=`fld-${name}`;
 if(type==='select')return `<div class="form-row"><label for="${idAttribute}">${lbl}</label><select id="${idAttribute}" name="${name}">${options.map(opt=>`<option value="${safe(opt)}" ${value===opt?'selected':''}>${safe(term(opt))}</option>`).join('')}</select></div>`;
 if(type==='checkbox')return `<label class="checkbox-field" for="${idAttribute}"><input id="${idAttribute}" name="${name}" type="checkbox" ${value?'checked':''}/><span>${tr(ar,en)}</span></label>`;
 if(type==='textarea')return `<div class="form-row"><label for="${idAttribute}">${lbl}</label><textarea id="${idAttribute}" name="${name}" rows="3" ${required?'required':''} maxlength="5000">${safe(value)}</textarea></div>`;
 const attrs=type==='number'?'min="0" max="100" step="1"':type==='money'?'min="0.01" step="0.01" inputmode="decimal"':'maxlength="200"';
 return `<div class="form-row"><label for="${idAttribute}">${lbl}</label><input id="${idAttribute}" name="${name}" type="${type==='money'?'number':type}" value="${safe(value)}" ${required?'required':''} ${attrs} /></div>`;
}
function openModal(type,itemId=null){const config=defs[type];if(!config)return;
 const item=itemId?state[config.collection].find(x=>x.id===itemId):null;if(itemId&&!item)return;
 editContext={type,id:itemId};lastFocus=document.activeElement;
 $('#modalTitle').textContent=(itemId?tr('تعديل ','Edit '):tr('إضافة ','Add '))+tr(config.ar,config.en);
 const important=config.fields.filter(f=>f[0]==='title'||f[0]==='type'||f[0]==='amount');const other=config.fields.filter(f=>!important.includes(f));
 $('#modalForm').innerHTML=`${[...important,...other].map(f=>fieldHTML(f,item)).join('')}<div class="modal-actions"><button type="button" class="secondary-btn" data-action="close">${tr('إلغاء','Cancel')}</button><button class="primary-btn" type="submit">${itemId?tr('حفظ التغييرات','Save changes'):tr('إضافة وحفظ','Add & save')}</button></div>`;
 showModal();setTimeout(()=>$('#modalForm input:not([type="checkbox"]), #modalForm select')?.focus(),30);
}
function showModal(){$('#modalBackdrop').classList.remove('hidden');document.body.classList.add('modal-open');}
function closeModal(){$('#modalBackdrop').classList.add('hidden');document.body.classList.remove('modal-open');editContext=null;lastFocus?.focus?.();}
function submitModal(e){e.preventDefault();if(!editContext?.type)return;const cfg=defs[editContext.type];const fd=new FormData(e.currentTarget),out={};
 for(const [name,,,type] of cfg.fields){if(type==='checkbox')out[name]=e.currentTarget.elements[name].checked;else if(type==='number'||type==='money')out[name]=Number(fd.get(name));else out[name]=String(fd.get(name)||'').trim();}
 if(out.title!==undefined&&!out.title.trim())return message(tr('اكتب عنوانًا أولًا','Title is required'),true);
 if(out.amount!==undefined && (!Number.isFinite(out.amount)||out.amount<=0))return message(tr('المبلغ يجب أن يكون أكبر من صفر','Amount must be greater than zero'),true);
 for(const x of ['progress'])if(x in out)out[x]=progress(out[x]);
 if(cfg.collection==='finance' && /^\d{4}-\d{2}/.test(out.date||'')) filters.finance=out.date.slice(0,7);
 if(cfg.collection==='routines' && out.date!==dateLocal()) filters.today='all';
 if(cfg.collection==='work' && out.status==='Done') filters.work='all';
 if(cfg.collection==='goals' && progress(out.progress)===100) filters.goals='all';
 if(editContext.id){const x=state[cfg.collection].find(v=>v.id===editContext.id);if(!x)return;Object.assign(x,out,{updatedAt:new Date().toISOString()});}
 else state[cfg.collection].unshift({id:id(),createdAt:new Date().toISOString(),...out});
 save();closeModal();renderAll();message(tr('تم الحفظ بنجاح','Saved successfully'));
}
function removeItem(type,itemId){const cfg=defs[type];if(!cfg)return;const x=state[cfg.collection].find(v=>v.id===itemId);if(!x)return;
 if(!confirm(tr(`حذف «${x.title||term(x.category)||cfg.ar}» نهائيًا؟`,`Permanently delete “${x.title||x.category||cfg.en}”?`)))return;
 state[cfg.collection]=state[cfg.collection].filter(v=>v.id!==itemId);save();renderView();message(tr('تم الحذف','Deleted'));
}
function exportData(){const json=JSON.stringify({...state,backupDate:new Date().toISOString(),appVersion:'2.5'},null,2);if(window.DailyLifeAndroid){window.DailyLifeAndroid.exportBackup(json);return;}const blob=new Blob([json],{type:'application/json'});const fileName=`daily-life-os-backup-${dateLocal()}.json`;
 // iPhone / iPad: use the share sheet (Save to Files, AirDrop, WhatsApp…) — plain downloads are unreliable there.
 if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare){const file=new File([blob],fileName,{type:'application/json'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Daily Life OS backup'}).then(()=>message(tr('تم إنشاء النسخة الاحتياطية','Backup generated'))).catch(()=>{});return;}}
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);message(tr('تم إنشاء النسخة الاحتياطية','Backup generated'));}
function importData(file){if(!file)return;if(file.size>10*1024*1024)return message(tr('الملف كبير جدًا (الحد 10MB)','Backup is too large (10MB max)'),true);
 const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)||!collectionKeys.some(k=>Array.isArray(parsed[k])))throw new Error('bad format');
 const incoming=normalize(parsed);const count=collectionKeys.reduce((n,k)=>n+incoming[k].length,0);if(!confirm(tr(`استيراد ${count} سجل؟ سيتم استبدال بياناتك الحالية. صدّر نسخة أولًا إن احتجتها.`,`Import ${count} records? This replaces your existing entries. Export a backup first if needed.`)))return;
 state=incoming;save();applyAppearance();renderAll();message(tr('تم استيراد النسخة بنجاح','Backup imported successfully'));
 }catch(e){message(tr('تعذر قراءة النسخة الاحتياطية. تأكد من الملف.','Could not import this backup file.'),true);}finally{$('#importFile').value='';}};reader.onerror=()=>message(tr('حدث خطأ أثناء قراءة الملف','Could not read the file'),true);reader.readAsText(file);}
function importAndroidBackupBase64(base64){try{const data=atob(base64),bytes=new Uint8Array(data.length);for(let i=0;i<data.length;i++)bytes[i]=data.charCodeAt(i);importData(new File([bytes],'android-backup.json',{type:'application/json'}));}catch(e){message(tr('تعذر قراءة النسخة','Could not read the backup'),true);}}
function resetData(){if(!confirm(tr('متأكد من حذف كل البيانات المخزنة هنا؟ لا يمكن التراجع عن هذه الخطوة.','Delete ALL local entries? This cannot be undone.')))return;
 if(!confirm(tr('تأكيد أخير: هل قمت بتصدير نسخة احتياطية؟','Final confirmation: Have you exported a backup?')))return;
 const theme=state.theme,accent=state.accent,lang=state.lang;state=normalize({...defaultState,theme,accent,lang});save();navigate('dashboard');message(tr('تم حذف البيانات','Local data cleared'));
}
function toggleLanguage(){state.lang=state.lang==='ar'?'en':'ar';save();applyAppearance();renderAll();}
function chooseAccent(accent){if(!COLOR_PRESETS[accent])return;state.accent=accent;save();applyAppearance();renderAll();message(tr('تم تطبيق ','Applied ')+appearanceName());}
function chooseMode(mode){if(!['light','dark'].includes(mode))return;state.theme=mode;save();applyAppearance();renderAll();message(tr('تم تطبيق ','Applied ')+appearanceName());}
function toggleTheme(){chooseMode(state.theme==='dark'?'light':'dark');}
function action(e){const b=e.target.closest('[data-action]');if(!b)return;const ac=b.dataset.action,type=b.dataset.type,itemId=b.dataset.id;
 switch(ac){
  case 'go':navigate(type);break;
  case 'quickPick':createPicker();break;
  case 'add':openModal(type);break;
  case 'edit':openModal(type,itemId);break;
  case 'delete':removeItem(type,itemId);break;
  case 'close':closeModal();break;
  case 'toggleRoutine':{const item=state.routines.find(x=>x.id===itemId);if(item)updateRecord('routine',itemId,{done:!item.done});break;}
  case 'toggleWork':{const item=state.work.find(x=>x.id===itemId);if(item)updateRecord('work',itemId,{status:item.status==='Done'?'Open':'Done'});break;}
  case 'progressDown':case 'progressUp':{const item=state[defs[type]?.collection]?.find(x=>x.id===itemId);if(item)updateRecord(type,itemId,{progress:progress(Number(item.progress||0)+(ac==='progressUp'?10:-10))});break;}
  case 'pinNote':{const item=state.notes.find(x=>x.id===itemId);if(item)updateRecord('note',itemId,{pinned:!item.pinned});break;}
   case 'biWindow':{const n=Number(b.dataset.biWindow);if([3,6,12].includes(n)){biWindow=n;biCategory='all';biSelectedMonth=null;renderReports();}break;}
   case 'biCategory':{biCategory=b.dataset.biCat||'all';renderReports();break;}
   case 'biMetric':{if(['income','expense','net'].includes(b.dataset.biMetric)){biTrendMetric=b.dataset.biMetric;renderReports();}break;}
   case 'biMonth':{biSelectedMonth=b.dataset.biMonth||null;renderReports();break;}
  case 'language':toggleLanguage();break;case 'theme':toggleTheme();break;case 'chooseAccent':chooseAccent(b.dataset.accent);break;case 'chooseMode':chooseMode(b.dataset.mode);break;case 'export':exportData();break;case 'import':if(window.DailyLifeAndroid)window.DailyLifeAndroid.openBackup();else $('#importFile').click();break;case 'reset':resetData();break;
 }
}
function init(){
 $$('.nav-item,.mobile-nav').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
 document.addEventListener('click',action);
 $('#menuToggle').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#navShade').classList.toggle('hidden',!$('#sidebar').classList.contains('open'));});
 $('#navShade').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#navShade').classList.add('hidden');});
 $('#themeToggle').addEventListener('click',toggleTheme);
 $('#langToggle').addEventListener('click',toggleLanguage);
 $('#quickAddBtn').addEventListener('click',()=>{if(currentView==='travel'){const n=tvNew();tvUI={open:n.id,guide:null};renderTravel();scrollTo(0,0);return;}if(currentView==='groceries'){const t=$('#grocIn');if(t){t.scrollIntoView({block:'center'});t.focus();}return;}const map={today:'routine',work:'work',education:'education',finance:'finance',goals:'goal',notes:'note'};map[currentView]?openModal(map[currentView]):createPicker();});
 $('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal();});
 $('#modalForm').addEventListener('submit',submitModal);
 $('#importFile').addEventListener('change',e=>importData(e.target.files?.[0]));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#navShade').classList.add('hidden');if(!$('#modalBackdrop').classList.contains('hidden'))closeModal();}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!$('#modalBackdrop').classList.contains('hidden')&&!editContext?.picker){e.preventDefault();$('#modalForm').requestSubmit();}});
 document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-search-input]')){searchText[el.dataset.searchInput]=el.value;applyClientFilter();}});
 document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-filter]')){const type=el.dataset.filter;if(type==='routine')filters.today=el.value;else if(type==='goal')filters.goals=el.value;else filters[type]=el.value;renderView();}else if(el.matches('[data-finance-period]')){filters.finance=el.value;renderView();}});
 document.addEventListener('submit',e=>{if(e.target.id!=='profileForm')return;e.preventDefault();const fd=new FormData(e.target);state.profile={...state.profile,name:String(fd.get('name')||'').trim().slice(0,80)||'Ramzi',country:COUNTRY_CURRENCY[String(fd.get('country'))]?String(fd.get('country')):profileCountry(),currency:COUNTRY_CURRENCY[String(fd.get('country'))]||state.profile.currency||'SAR',monthlyIncome:Math.max(0,Number(fd.get('monthlyIncome'))||0)};save();renderAll();message(tr('تم حفظ الملف الشخصي','Profile saved'));});
 window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(viewNames[v]&&v!==currentView)navigate(v);});
 window.addEventListener('storage',e=>{if(e.key!==STORAGE_KEY)return;state=load();applyAppearance();renderAll();message(tr('تحدّثت البيانات من تبويب آخر','Data updated in another tab'));});
 applyAppearance();navigate(currentView);updateStorage();
}

// ---- Reminders & notifications (Android app) ----
const NOTIFY_DEFAULTS={enabled:true,tasks:true,lead:0,summary:true,summaryTime:'08:00',due:true,dueTime:'09:00'};
let reminderCount=null, reminderTimer=null;
const androidNotify=()=>window.DailyLifeAndroid&&typeof window.DailyLifeAndroid.syncReminders==='function'?window.DailyLifeAndroid:null;
function notifySettings(){return {...NOTIFY_DEFAULTS,...(state.notify&&typeof state.notify==='object'?state.notify:{})};}
function notifyStatus(){const a=androidNotify();if(!a)return null;try{return JSON.parse(a.notificationStatus()||'{}');}catch{return {};}}
function localMs(date,time){if(!date)return NaN;const [y,m,d]=String(date).slice(0,10).split('-').map(Number);const [hh,mm]=String(time||'09:00').split(':').map(Number);return new Date(y,(m||1)-1,d||1,hh||0,mm||0,0,0).getTime();}
function ymd(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function clock(t){const [hh,mm]=String(t||'').split(':').map(Number);if(isNaN(hh))return '';return new Intl.DateTimeFormat(state.lang==='ar'?'ar-SA-u-nu-latn':'en-US',{hour:'numeric',minute:'2-digit'}).format(new Date(2000,0,1,hh,mm||0));}
function taskCount(n){if(state.lang!=='ar')return `${n} task${n===1?'':'s'}`;return n===1?'مهمة واحدة':n===2?'مهمتين':n<=10?`${n} مهام`:`${n} مهمة`;}
function buildReminders(){
 const s=notifySettings(),now=Date.now(),list=[],used=new Set(),lang=state.lang;
 const push=(key,it)=>{if(!(it.at>now))return;let h=2166136261;for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}let n=(h>>>0)%900000+1000;while(used.has(n))n=n+1>=901000?1000:n+1;used.add(n);list.push({id:n,lang,kind:'task',task:'',...it});};
 if(s.tasks)for(const r of state.routines){if(r.done||!r.date||!r.time)continue;const lead=Number(s.lead)||0;
  push('r'+r.id+r.date+r.time+lead,{at:localMs(r.date,r.time)-lead*60000,title:`⏰ ${r.title}`,
   body:lead?tr(`بعد ${lead} دقيقة · ${clock(r.time)}`,`In ${lead} min · ${clock(r.time)}`):tr(`حان وقت المهمة · ${clock(r.time)}`,`It's time · ${clock(r.time)}`),view:'today',task:'routine:'+r.id});}
 if(s.due){
  for(const w of state.work){if(!w.due||w.status==='Done')continue;push('w'+w.id+w.due+s.dueTime,{at:localMs(w.due,s.dueTime),title:`📌 ${w.title}`,body:tr('اليوم موعد تسليم مهمة العمل','This work task is due today')+(w.project?` · ${w.project}`:''),view:'work',task:'work:'+w.id});}
  for(const g of state.goals){if(!g.due||progress(g.progress)>=100)continue;push('g'+g.id+g.due+s.dueTime,{at:localMs(g.due,s.dueTime),title:`🎯 ${g.title}`,body:tr(`اليوم التاريخ المستهدف لهدفك (${progress(g.progress)}%)`,`Your goal's target date is today (${progress(g.progress)}%)`)+(g.milestone?tr(` · الخطوة القادمة: ${g.milestone}`,` · Next: ${g.milestone}`):''),view:'goals'});}
  for(const e of state.education){if(!e.target||progress(e.progress)>=100)continue;push('e'+e.id+e.target+s.dueTime,{at:localMs(e.target,s.dueTime),title:`📚 ${e.title}`,body:tr(`اليوم التاريخ المستهدف (${progress(e.progress)}%) — كمّل وأنجزها!`,`Target date is today (${progress(e.progress)}%) — finish strong!`),view:'education'});}
 }

function computePrayerTimes(y,m,d,lat,lng,s){

 for(const k in r)r[k]+=tz-lng/15;

 if(meth.isha)r.isha=hl(r.isha,r.sunset,meth.isha,false);
 else{const ram=meth.ramadanIshaMin&&hijriMonth(new Date(y,m-1,d,12))===9;r.isha=r.maghrib+(ram?meth.ramadanIshaMin:meth.ishaMin)/60;}

}

function quranPos(){try{return {page:1,mode:'h',mark:0,...JSON.parse(localStorage.getItem(QK)||'{}')};}catch{return {page:1,mode:'h',mark:0};}}
function quranSave(ch){const s={...quranPos(),...ch};try{localStorage.setItem(QK,JSON.stringify(s));}catch{}return s;}
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const qNum=n=>state.lang==='ar'?arNum(n):String(n);

function quranFont(p){const name='QCF_P'+String(p).padStart(3,'0');if(!quranFonts[p]){const f=new FontFace(name,`url(quran/fonts/${name}.woff2)`);document.fonts.add(f);quranFonts[p]=f.load().catch(()=>null);}return quranFonts[p];}

function quranPageHTML(p){const pg=QURAN.pages[p-1],font='QCF_P'+String(p).padStart(3,'0'),opening=p<=2;let lines='';
 for(let n=1;n<=15;n++){const L=pg.lines[n];
  if(typeof L==='string')lines+=`<div class="mp-line">${L.split('|').map(g=>`<span>${g}</span>`).join('')}</div>`;
  else if(L&&L[0]==='H')lines+=`<div class="mp-line mp-surah"><span>سُورَةُ ${safe(QURAN.chapters[L[1]-1][1])}</span></div>`;
  else if(L&&L[0]==='B')lines+=`<div class="mp-line mp-basmala">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>`;
  else if(!opening)lines+='<div class="mp-line"></div>';}
 return `<div class="mp-head"><span>${safe(chapterName(pg.s))}</span><span>${tr('الجزء','Juz')} ${qNum(pg.j)}</span></div>
  <div class="mp-body ${opening?'mp-opening':''}" style="font-family:'${font}'">${lines}</div><div class="mp-foot">${qNum(p)}</div>`;}
function fillPage(el,p){el.dataset.p=p;el.classList.add('mp-wait');el.innerHTML=quranPageHTML(p);quranFont(p).then(()=>{if(el.dataset.p==String(p))el.classList.remove('mp-wait');});

function quranGo(p,how){p=Math.max(1,Math.min(604,Math.round(Number(p))||1));const s=quranSave({page:p});
 const ind=$('#quranPageNo');if(ind)ind.value=p;const fno=$('#quranFabNo');if(fno)fno.textContent=qNum(p);const sel=$('#quranSurah');if(sel&&QURAN){let c=1;for(const ch of QURAN.chapters)if(ch[4]<=p)c=ch[0];sel.value=c;}
 const jz=$('#quranJuz');if(jz&&QURAN)jz.value=QURAN.pages[p-1].j;
 if(s.mode==='h'){const el=$('#mushafPage');if(!el)return;if(how)el.classList.remove('mp-in-next','mp-in-prev');fillPage(el,p);if(how){void el.offsetWidth;el.classList.add(how==='next'?'mp-in-next':'mp-in-prev');}}

  :`<div class="mushaf-scroll">${Array.from({length:604},(_,i)=>`<div class="mushaf-page mp-slot" data-slot="${i+1}"></div>`).join('')}</div>`}<button type="button" class="quran-fab" data-quran="tools" aria-label="${tr('أدوات المصحف','Mushaf controls')}"><span class="qf-o">⌃ ${tr('الأدوات','Controls')} · ${tr('صفحة','page')} <span id="quranFabNo"></span></span><span class="qf-x">✕ ${tr('إغلاق','Close')}</span></button>

function quranSwipe(stage){if(!stage)return;let x0=0,y0=0,t0=0;

  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&Date.now()-t0<900){
   // Arabic mushaf: pulling the page to the right turns to the next page.
   const next=state.lang==='ar'?dx>0:dx<0;quranStep(next?1:-1);}},{passive:true});}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-quran]');if(!b)return;const a=b.dataset.quran,s=quranPos();

function akToday(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
function akState(){let s;try{s=JSON.parse(localStorage.getItem(AKK)||'{}');}catch{s={};}
 const t={i:0,n:0,goal:33,rounds:0,total:0,...(s.t||{})};
 if(s.d!==akToday())return {d:akToday(),c:{},t:{...t,n:0,rounds:0,total:0}};
 return {d:s.d,c:s.c||{},t};}
function akSave(s){try{localStorage.setItem(AKK,JSON.stringify(s));}catch{}}
function loadAdhkar(){if(ADHKAR)return Promise.resolve(ADHKAR);if(!adhkarLoading)adhkarLoading=fetch('adhkar.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>ADHKAR=j).catch(e=>{adhkarLoading=null;throw e;});return adhkarLoading;}
function akItems(cat){const out=[];cat.groups.forEach(g=>g.items.forEach(x=>out.push(x)));return out;}
function akProgress(cat,s){const items=akItems(cat),c=s.c[cat.id]||{};let done=0;items.forEach((x,i)=>{if((c[i]||0)>=x.n)done++;});return {done,total:items.length};}
function akText(t){return safe(t).replace(/\{([^}]*)\}/g,'<span class="dk-inl">($1)</span>');}
function akSuggest(){const h=new Date().getHours();return h>=4&&h<12?'morning':h>=12&&h<15?'prayer':h>=15&&h<22?'evening':'sleep';}
function akVibe(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch{}}
function akName(c){return tr(c.ar,c.en);}
function renderAdhkar(){const el=$('#adhkarView');
 if(!ADHKAR){el.innerHTML=`<div class="card ak-loading">📿 ${tr('جاري تحميل الأذكار…','Loading adhkar…')}</div>`;
  loadAdhkar().then(()=>{if(currentView==='adhkar')renderAdhkar();}).catch(()=>{el.innerHTML=`<div class="card">${tr('تعذر تحميل الأذكار','Could not load the adhkar')}</div>`;});return;}
 const s=akState(),cat=ADHKAR.cats.find(c=>c.id===adhkarCat);

function akTile(c,s,extra=''){
 if(c.id==='tasbih')return `<button type="button" class="ak-tile ${extra}" data-ak="open" data-cat="tasbih"><span class="ak-ic">${c.icon}</span><span class="ak-nm">${safe(akName(c))}</span><span class="ak-sub">${tr('اليوم','Today')}: ${qNum(s.t.total)}</span></button>`;

function akHome(s){const sug=ADHKAR.cats.find(c=>c.id===akSuggest());
 return `<div class="card ak-hero"><div><div class="ak-hero-k">${tr('مقترح الآن','Suggested now')}</div><div class="ak-hero-t">${sug.icon} ${safe(akName(sug))}</div></div>

function akHead(cat,s){const pr=cat.id==='tasbih'?null:akProgress(cat,s);
 return `<div class="ak-head card"><button type="button" class="qbtn" data-ak="home" aria-label="${tr('رجوع','Back')}">${state.lang==='ar'?'→':'←'}</button>
  <div class="ak-head-t"><div class="ak-head-n">${cat.icon} ${safe(akName(cat))}</div>${pr?`<div class="ak-head-p" id="akHeadP">${qNum(pr.done)} / ${qNum(pr.total)}</div>`:''}</div>
  <button type="button" class="qbtn" data-ak="reset" aria-label="${tr('إعادة العد','Reset')}" title="${tr('إعادة العد','Reset')}">↺</button>

function akCard(x,i,c){const n=Math.min(c[i]||0,x.n),done=n>=x.n,ar=state.lang==='ar',f=ar?x.f:x.fe,src=ar?x.s:x.se,note=ar?x.note:(x.ne||x.note);
 const more=(f||src)?`<details class="dk-more"><summary>${tr('الفضل والمصدر','Virtue & source')}</summary>${f?`<p>${akText(f)}</p>`:''}${src?`<p class="dk-src">${akText(src)}</p>`:''}</details>`:'';
 return `<article class="dk-card ${done?'done':''}" id="dk${i}"><div class="dk-top"><span class="dk-num">${qNum(i+1)}</span>
  <span class="dk-chip">${x.n>1?tr(`التكرار: ${qNum(x.n)}`,`Repeat ${x.n}×`):tr('مرة واحدة','Once')}</span>${note?`<span class="dk-chip dk-note">${safe(note)}</span>`:''}</div>
  <p class="dk-text" lang="ar" dir="rtl">${akText(x.t)}</p>${state.lang!=='ar'&&x.tr?`<p class="dk-tr" lang="en" dir="ltr">${safe(x.tr)}</p>`:''}${more}
  <button type="button" class="dk-count" data-ak="tap" data-i="${i}" style="--p:${Math.round(n/x.n*100)}%"><span class="dk-lbl">${done?'✓ '+tr('تم','Done'):tr('اضغط للعد','Tap to count')}</span><b>${qNum(n)} / ${qNum(x.n)}</b></button></article>`;}
function akCategory(cat,s){const c=s.c[cat.id]||{};let i=0;
 const body=cat.groups.map(g=>`${g.ar?`<h3 class="dk-group">${safe(tr(g.ar,g.en))}</h3>`:''}${g.items.map(x=>akCard(x,i++,c)).join('')}`).join('');
 const pr=akProgress(cat,s);
 return akHead(cat,s)+body+`<div class="card ak-finish ${pr.done>=pr.total?'':'hidden'}" id="akFinish"><div class="ak-finish-t">✓ ${tr('أتممت '+cat.ar+' — تقبّل الله منك','You completed '+cat.en+' — may Allah accept it')}</div>
  <button type="button" class="secondary-btn" data-ak="reset">↺ ${tr('ابدأ من جديد','Start again')}</button></div>`;}
function akTasbih(cat,s){const t=s.t,p=AK_PRESETS[t.i]||AK_PRESETS[0];
 return akHead(cat,s)+`<div class="card tb-wrap">
  <div class="tb-chips">${AK_PRESETS.map((x,i)=>`<button type="button" class="tb-chip" data-ak="preset" data-i="${i}" aria-pressed="${i===t.i}" lang="ar">${x[0]}</button>`).join('')}</div>

  <div class="tb-ring" id="tbRing" style="--p:${t.goal?Math.round(t.n/t.goal*100):0}%"><button type="button" class="tb-btn" data-ak="tb" aria-label="${tr('سبّح','Count')}"><b id="tbN">${qNum(t.n)}</b><small>${t.goal?`/ ${qNum(t.goal)}`:'∞'}</small></button></div>
  <div class="tb-goals">${[33,100,0].map(g=>`<button type="button" class="tb-chip" data-ak="goal" data-g="${g}" aria-pressed="${t.goal===g}">${g?qNum(g):tr('بدون حد','No limit')}</button>`).join('')}</div>
  <div class="tb-stats"><div class="tb-stat"><span>${tr('الدورات','Rounds')}</span><b id="tbR">${qNum(t.rounds)}</b></div><div class="tb-stat"><span>${tr('مجموع اليوم','Today')}</span><b id="tbT">${qNum(t.total)}</b></div></div>
 </div>`;}
function akRefreshHead(cat,s){const pr=akProgress(cat,s),p=$('#akHeadP'),b=$('#akHeadBar'),f=$('#akFinish');
 if(p)p.textContent=`${qNum(pr.done)} / ${qNum(pr.total)}`;if(b)b.style.setProperty('--p',Math.round(pr.done/pr.total*100)+'%');if(f)f.classList.toggle('hidden',pr.done<pr.total);return pr;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ak]');if(!b||!ADHKAR)return;const a=b.dataset.ak;
 if(a==='open'){adhkarCat=b.dataset.cat;renderAdhkar();window.scrollTo({top:0,behavior:'instant'});return;}
 if(a==='home'){adhkarCat=null;renderAdhkar();window.scrollTo({top:0,behavior:'instant'});return;}
 const s=akState(),cat=ADHKAR.cats.find(c=>c.id===adhkarCat);if(!cat)return;
 if(a==='reset'){if(cat.id==='tasbih'){s.t={...s.t,n:0,rounds:0};}else delete s.c[cat.id];akSave(s);renderAdhkar();if(cat.id!=='tasbih')window.scrollTo({top:0,behavior:'smooth'});return;}
 if(a==='tap'){const i=Number(b.dataset.i),x=akItems(cat)[i];if(!x)return;const c=s.c[cat.id]=s.c[cat.id]||{};const n=c[i]||0;if(n>=x.n)return;
  c[i]=n+1;akSave(s);const done=c[i]>=x.n;
  b.style.setProperty('--p',Math.round(c[i]/x.n*100)+'%');b.querySelector('b').textContent=`${qNum(c[i])} / ${qNum(x.n)}`;
  b.classList.remove('dk-pop');void b.offsetWidth;b.classList.add('dk-pop');
