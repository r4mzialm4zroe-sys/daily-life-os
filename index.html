  akVibe([30,40,30]);const card=b.closest('.dk-card');card.classList.add('done');b.querySelector('.dk-lbl').textContent='✓ '+tr('تم','Done');
  const pr=akRefreshHead(cat,s);
  if(pr.done>=pr.total){setTimeout(()=>{const f=$('#akFinish');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});},260);return;}
  const items=akItems(cat);let j=i+1;while(j<items.length&&(c[j]||0)>=items[j].n)j++;
  if(j>=items.length){j=0;while(j<items.length&&(c[j]||0)>=items[j].n)j++;}
  const next=document.getElementById('dk'+j);if(next)setTimeout(()=>next.scrollIntoView({block:'center',behavior:'smooth'}),260);return;}
 if(a==='preset'){s.t={...s.t,i:Number(b.dataset.i),n:0};akSave(s);renderAdhkar();return;}
 if(a==='goal'){s.t={...s.t,goal:Number(b.dataset.g),n:0};akSave(s);renderAdhkar();return;}
 if(a==='tb'){const t=s.t;t.n++;t.total++;let lap=false;if(t.goal&&t.n>=t.goal){t.rounds++;t.n=0;lap=true;}akSave(s);

});

// ---- Groceries (المقاضي): paste a message -> checklist ----
function grocList(){if(!Array.isArray(state.groceries))state.groceries=[];state.groceries=state.groceries.filter(x=>x&&typeof x.t==='string');return state.groceries;}
function grocParse(text){let lines=String(text||'').replace(/\r/g,'').split(/\n+/);
 if(lines.filter(l=>l.trim()).length===1&&/[،,]/.test(lines[0]))lines=lines[0].split(/[،,]+/);
 return lines.map(l=>l.replace(/^\s*\[[^\]]{3,40}\]\s*[^:\n]{1,40}:\s*/,'')                       // WhatsApp "[10:22, 5/11] Dana:" prefix
  .replace(/^\s*(?:[-–—•*·▪●○◦✓✔☐☑✅🔹🔸➖➡️]+|\(?[0-9٠-٩]{1,3}\s*[.)\-:،]\)?)\s*/u,'')                     // bullets / numbering
  .replace(/\s+/g,' ').trim()).filter(l=>l&&l.length<=160);}
function grocKey(t){return t.replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();}
function grocAdd(text){const list=grocList(),items=grocParse(text);let added=0,back=0;
 for(const t of items){const k=grocKey(t),ex=list.find(x=>grocKey(x.t)===k);
  if(ex){if(ex.done){ex.done=false;back++;}continue;}
  list.push({id:id(),t,done:false});added++;}
 if(added||back){save();renderGroceries();}
 message(added||back?tr(`تمت إضافة ${qNum(added+back)} ${added+back===1?'غرض':'أغراض'} 🛒`,`Added ${added+back} item${added+back===1?'':'s'} 🛒`):tr('ما فيه أغراض جديدة','No new items'));
 return added+back;}
function renderGroceries(){const el=$('#groceriesView');if(!el)return;const list=grocList(),done=list.filter(x=>x.done).length,total=list.length;
 const rows=list.map(x=>`<li class="gr-item ${x.done?'done':''}"><button type="button" class="gr-row" data-gr="toggle" data-id="${x.id}" aria-pressed="${x.done}">
   <span class="gr-box" aria-hidden="true">${x.done?'✓':''}</span><span class="gr-t">${safe(x.t)}</span></button>
   <button type="button" class="gr-del" data-gr="del" data-id="${x.id}" aria-label="${tr('حذف','Delete')}">✕</button></li>`).join('');
 el.innerHTML=`<div class="card gr-input">
  <div class="gr-head"><h3>🛒 ${tr('المقاضي','Groceries')}</h3><span class="hint">${tr('الصق الرسالة وكل سطر يصير غرض','Paste the message — every line becomes an item')}</span></div>
  <textarea id="grocIn" rows="3" dir="auto" placeholder="${tr('الصق رسالة المقاضي هنا…\nمكرونة\nلبنة','Paste the shopping message here…\nPasta\nLabneh')}"></textarea>
  <div class="gr-actions"><button type="button" class="secondary-btn" data-gr="paste">📋 ${tr('لصق','Paste')}</button>
   <button type="button" class="primary-btn" data-gr="add">＋ ${tr('أضف للقائمة','Add to list')}</button></div></div>
 <div class="card gr-listcard">
  <div class="gr-listhead"><b>${tr('القائمة','List')}</b>${total?`<span class="gr-count">${done===total?'✓ '+tr('اشتريت كل شيء 🎉','All bought 🎉'):tr(`${qNum(done)} من ${qNum(total)}`,`${done} of ${total}`)}</span>`:''}</div>
  ${total?`<span class="ak-bar gr-bar"><i style="--p:${Math.round(done/total*100)}%"></i></span><ul class="gr-list">${rows}</ul>
  <div class="gr-tools">${done?`<button type="button" class="secondary-btn" data-gr="cleardone">🧹 ${tr('احذف المشترى','Remove bought')}</button><button type="button" class="secondary-btn" data-gr="uncheck">↺ ${tr('إلغاء التحديد','Uncheck all')}</button>`:''}
   <button type="button" class="secondary-btn gr-danger" data-gr="clear">🗑️ ${tr('مسح القائمة','Clear list')}</button></div>`
  :`<div class="gr-empty">${tr('القائمة فاضية — الصق رسالة المقاضي فوق 👆','The list is empty — paste the shopping message above 👆')}</div>`}</div>`;}
document.addEventListener('paste',e=>{if(e.target&&e.target.id==='grocIn'){const t=(e.clipboardData||window.clipboardData).getData('text');
 if(t&&(/\n/.test(t.trim())||/[،,]/.test(t))){e.preventDefault();if(grocAdd(t))e.target.value='';}}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='grocIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(grocAdd(e.target.value))e.target.value='';}});
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-gr]');if(!b)return;const a=b.dataset.gr,list=grocList();
 if(a==='toggle'){const x=list.find(i=>i.id===b.dataset.id);if(!x)return;x.done=!x.done;save();
  const li=b.closest('.gr-item');li.classList.toggle('done',x.done);b.setAttribute('aria-pressed',x.done);b.querySelector('.gr-box').textContent=x.done?'✓':'';
  try{if(navigator.vibrate)navigator.vibrate(x.done?18:8);}catch{}
  const d=list.filter(i=>i.done).length;if(d===list.length||!x.done||d===1)renderGroceries();else{const c=$('.gr-count'),bar=$('.gr-bar i');if(c)c.textContent=tr(`${qNum(d)} من ${qNum(list.length)}`,`${d} of ${list.length}`);if(bar)bar.style.setProperty('--p',Math.round(d/list.length*100)+'%');}
  return;}
 if(a==='del'){state.groceries=list.filter(i=>i.id!==b.dataset.id);save();renderGroceries();return;}
 if(a==='add'){const t=$('#grocIn');if(t&&t.value.trim()&&grocAdd(t.value))t.value='';else if(t&&!t.value.trim())t.focus();return;}
 if(a==='paste'){const t=$('#grocIn');try{const txt=await navigator.clipboard.readText();if(txt&&txt.trim()){grocAdd(txt);return;}}catch{}
  if(t){t.focus();message(tr('اضغط مطولاً على المربع واختر «لصق»','Long-press the box and choose “Paste”'));}return;}
 if(a==='cleardone'){state.groceries=list.filter(i=>!i.done);save();renderGroceries();return;}
 if(a==='uncheck'){list.forEach(i=>i.done=false);save();renderGroceries();return;}
 if(a==='clear'){if(confirm(tr('مسح كل القائمة؟','Clear the whole list?'))){state.groceries=[];save();renderGroceries();}return;}
});

// ---- Travel (السفر): trip planner ----
const TV={idx:null,info:null,cmap:{},c:{},load:{}};
let tvUI={open:null,guide:null},tvSheet=null;
function tvFetch(u){return fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});}
function tvBase(){if(TV.idx&&TV.info)return Promise.resolve();
 if(!TV.load.base)TV.load.base=Promise.all([tvFetch('travel/index.json'),tvFetch('travel/info.json')]).then(([a,b])=>{TV.idx=a;TV.info=b;a.countries.forEach(c=>TV.cmap[c.cc]=c);}).catch(e=>{TV.load.base=null;throw e;});
 return TV.load.base;}
function tvData(cc){if(TV.c[cc])return Promise.resolve(TV.c[cc]);
 if(!TV.load[cc])TV.load[cc]=tvFetch(`travel/c/${cc}.json`).then(d=>{d.keys=d.p.map(r=>' '+tvKey(r[0])+' | '+tvKey(r[1]));return TV.c[cc]=d;}).catch(e=>{delete TV.load[cc];throw e;});

function tvSearch(d,q,filter,limit=120){const k=tvKey(q),pre=[],mid=[];if(!k)return [];
 for(let i=0;i<d.p.length&&pre.length<limit;i++){if(filter&&!filter(d.p[i]))continue;const s=d.keys[i],j=s.indexOf(k);if(j<0)continue;

 // Arabic typed, but most places abroad only have a Latin name: also match by pronunciation (اوزنجول ≈ Uzungöl)
 const sq=/[؀-ۿ]/.test(q)?tvSkel(q):'';
 if(sq.length>=3&&out.length<25){if(!d.sk)d.sk=d.p.map(r=>tvSkel(r[0]));const seen=new Set(out),a=[],b=[];
  for(let i=0;i<d.p.length&&a.length<60;i++){const r=d.p[i];if(seen.has(r)||(filter&&!filter(r)))continue;const j=d.sk[i].indexOf(sq);if(j<0)continue;(j===0?a:b).push(r);}
