  <title>Daily Life OS — BI Pro v2.5</title>
    <style>
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --text: #182230;
  --muted: #6b7280;
  --border: #dfe5ee;
  --primary: #2563eb;
  --primary-soft: #dbeafe;
  --success: #059669;
  --warning: #d97706;
  --danger: #dc2626;
  --shadow: 0 12px 30px rgba(15, 23, 42, .08);
  --radius: 18px;
}
body.dark {
  --bg: #0b1220;
  --surface: #121b2b;
  --surface-2: #1a2639;
  --text: #f5f7fb;
  --muted: #a9b4c3;
  --border: #26364d;
  --primary: #60a5fa;
  --primary-soft: #19345e;
  --shadow: 0 12px 30px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 270px 1fr; }
.sidebar {
  position: sticky; top: 0; height: 100vh; background: #0f172a; color: #fff;
  padding: 24px 18px; display: flex; flex-direction: column; z-index: 20;
}
.brand { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; }
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
  font-weight: 800; font-size: 22px; background: linear-gradient(135deg,#3b82f6,#8b5cf6);
}
.brand h1 { font-size: 18px; margin: 0; }
.brand span { color: #9ca3af; font-size: 12px; }
.nav-list { display: grid; gap: 7px; }
.nav-item {
  border: 0; background: transparent; color: #cbd5e1; border-radius: 12px;
  padding: 12px 14px; text-align: left; display: flex; gap: 12px; align-items: center;
}
.nav-item:hover, .nav-item.active { background: rgba(255,255,255,.1); color: #fff; }
.sidebar-footer { margin-top: auto; }
.storage-status { padding: 14px; border-radius: 14px; background: rgba(255,255,255,.08); display: grid; gap: 4px; }
.storage-status span { color: #94a3b8; font-size: 12px; }
.main { min-width: 0; }
.topbar {
  min-height: 84px; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); z-index: 15; border-bottom: 1px solid var(--border);
}
.topbar h2 { margin: 2px 0 0; font-size: 25px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 13px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn, .primary-btn, .secondary-btn, .danger-btn {
  border: 0; border-radius: 12px; min-height: 42px; padding: 0 15px;
}
.icon-btn { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.primary-btn { background: var(--primary); color: white; font-weight: 700; }
.secondary-btn { background: var(--surface-2); color: var(--text); }
.danger-btn { background: #fee2e2; color: #991b1b; }
.view { display: none; padding: 28px; }
.view.active { display: block; }
.grid { display: grid; gap: 18px; }
.grid.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 14px; }
.kpi-card .kpi-label { color: var(--muted); font-size: 13px; }
.kpi-card .kpi-value { font-size: 30px; font-weight: 800; margin: 10px 0 4px; }
.kpi-card .kpi-foot { font-size: 12px; color: var(--muted); }
.section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
.section-head h3 { margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.list { display: grid; gap: 10px; }
.list-item {
  border: 1px solid var(--border); border-radius: 14px; padding: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.list-item-main { min-width: 0; }
.list-item h4 { margin: 0 0 5px; font-size: 15px; }
.list-item p { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 700; }
.badge.open { background: #dbeafe; color: #1d4ed8; }
.badge.done { background: #d1fae5; color: #047857; }
.badge.pending { background: #fef3c7; color: #92400e; }
.badge.high { background: #fee2e2; color: #991b1b; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.action-btn { border: 0; border-radius: 9px; padding: 7px 9px; background: var(--surface-2); color: var(--text); }
.progress { height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.form-grid { display: grid; gap: 14px; }
.form-row { display: grid; gap: 6px; }
.form-row label { font-size: 13px; font-weight: 700; }
input, select, textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 11px;
  background: var(--surface); color: var(--text); padding: 11px 12px;
}
textarea { min-height: 110px; resize: vertical; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.table-wrap { overflow-x: auto; }
.chart {
  height: 220px; display: flex; align-items: end; gap: 12px; padding-top: 20px;
}
.bar-wrap { flex: 1; display: grid; gap: 8px; align-items: end; height: 100%; }
.bar { background: var(--primary); border-radius: 8px 8px 3px 3px; min-height: 4px; }
.bar-label { text-align: center; color: var(--muted); font-size: 11px; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(2,6,23,.62); display: grid; place-items: center;
  padding: 20px; z-index: 100;
}
.hidden { display: none !important; }
.modal {
  width: min(680px, 100%); max-height: 92vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
}
.modal-header { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.modal-header h3 { margin: 0; }
.modal-body { padding: 20px; display: grid; gap: 14px; }
.toast {
  position: fixed; right: 22px; bottom: 22px; background: #111827; color: white;
  padding: 13px 16px; border-radius: 12px; z-index: 200; box-shadow: var(--shadow);
}
.mobile-only { display: none; }
.hero {
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  color: white; border-radius: 22px; padding: 26px; margin-bottom: 18px;
}
.hero h3 { font-size: 28px; margin: 0 0 8px; }
.hero p { margin: 0; color: rgba(255,255,255,.82); }
.quick-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 18px; }
.quick-card { background: rgba(255,255,255,.14); padding: 14px; border-radius: 14px; }
.quick-card strong { display: block; font-size: 22px; }
.settings-actions { display: flex; flex-wrap: wrap; gap: 10px; }
@media (max-width: 1050px) {
  .grid.kpis { grid-template-columns: repeat(2,1fr); }
  .grid.three { grid-template-columns: 1fr 1fr; }
  .quick-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 780px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: -290px; width: 270px; transition: .25s ease; box-shadow: 18px 0 40px rgba(0,0,0,.3);
  }
  .sidebar.open { left: 0; }
  .mobile-only { display: inline-flex; align-items: center; justify-content: center; }
  .topbar { padding: 14px 16px; }
  .view { padding: 16px; }
  .grid.two, .grid.three { grid-template-columns: 1fr; }
  .primary-btn { padding: 0 11px; }
}
@media (max-width: 520px) {
  .grid.kpis { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: 1fr 1fr; }
  .topbar h2 { font-size: 20px; }
  .topbar-actions .primary-btn { font-size: 0; width: 44px; padding: 0; }
  .topbar-actions .primary-btn::after { content: "＋"; font-size: 22px; }
  .list-item { align-items: flex-start; flex-direction: column; }
}

.mobile-bottom-nav { display:none; }
@media (max-width: 780px) {
  body { padding-bottom: 78px; }
  .mobile-bottom-nav {
    position: fixed; z-index: 60; left: 10px; right: 10px; bottom: 10px;
    height: 66px; display: grid; grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
    backdrop-filter: blur(18px); padding: 6px;
  }
  .mobile-nav {
    border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; align-content: center; gap: 2px;
    border-radius: 14px; min-width: 0;
  }
  .mobile-nav span { font-size: 20px; line-height: 1; }
  .mobile-nav small { font-size: 10px; font-weight: 700; }
  .mobile-nav.active { color: var(--primary); background: var(--primary-soft); }
  .topbar { min-height: 74px; }
  .hero { padding: 22px; border-radius: 20px; }
  .hero h3 { font-size: 24px; }
  .card { border-radius: 16px; padding: 16px; }
}

/* Accent-only color themes. Neutral colors, text, semantic statuses and layout are unchanged. */
:root{
 --accent-button:#2563eb; --accent-glow:rgba(37,99,235,.12);
 --neon-brand-a:#5573F2; --neon-brand-b:#6F65EF;
 --neon-hero-a:#1d4ed8; --neon-hero-b:#7c3aed;
}
.brand-mark{background:linear-gradient(135deg,var(--neon-brand-a),var(--neon-brand-b));box-shadow:0 6px 18px rgba(0,0,0,.16);}
.hero{background:linear-gradient(135deg,var(--neon-hero-a),var(--neon-hero-b));}
.primary-btn{background:var(--accent-button);}
.mobile-nav.active{box-shadow:inset 0 0 0 1px var(--accent-glow);}
.theme-controls{display:grid;gap:18px;margin-top:15px;}
.theme-control-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px;}
.theme-control-head strong{font-size:13px;}
.theme-control-head small{font-size:12px;color:var(--muted);}
.theme-colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
.theme-color-option{
 border:1px solid var(--border);border-radius:13px;min-width:0;min-height:80px;
 background:var(--surface);color:var(--text);display:grid;align-content:center;
 justify-items:center;gap:8px;font-size:12px;font-weight:650;padding:11px 7px;
}
.theme-color-option:hover,.theme-mode-option:hover{border-color:var(--primary);}
.theme-color-option[aria-pressed="true"],.theme-mode-option[aria-pressed="true"]{

/* v2.5.2 — Unified layout rhythm / RTL-LTR symmetry across the entire application.
   Accent palettes, backgrounds and application behavior intentionally stay unchanged. */
:root{--ui-space:16px;--ui-small-space:10px;--ui-control-height:42px}
.view,.main,.grid,.bi-grid,.bi-compare-grid,.bi-stat-grid{min-width:0}
.card,.bi-card,.bi-stat,.bi-compare-tile,.quick-card{min-width:0;box-sizing:border-box}
.card h3,.bi-card h3,.bi-section-title h3{line-height:1.4;overflow-wrap:anywhere}
.card p,.bi-card p,.bi-section-title p{overflow-wrap:anywhere}
button,select,input,textarea{min-width:0;max-width:100%}
.primary-btn,.secondary-btn,.danger-btn,.icon-btn,.lang-btn{min-height:var(--ui-control-height)}
.section-head,.bi-card-head,.bi-section-title,.bi-intro{direction:inherit}
.section-head>*,.bi-card-head>*,.bi-section-title>*,.bi-intro>*{min-width:0}
.grid.kpis,.grid.two,.grid.three,.bi-stat-grid,.bi-compare-grid{align-items:stretch}
/* Dashboard headline: all four values and labels occupy identical rows. */
.quick-grid{align-items:stretch;grid-auto-rows:1fr}
.quick-card{display:grid;grid-template-rows:minmax(34px,auto) minmax(2.85em,auto);align-content:stretch;align-items:end;gap:6px;padding:14px;line-height:1.35;text-align:start}
.quick-card strong{display:block;margin:0;width:100%;font-size:clamp(16px,1.9vw,22px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;align-self:end;overflow-wrap:anywhere;text-align:start;direction:inherit}
.quick-card > span{display:block;width:100%;align-self:start;line-height:1.4;font-size:14px;min-width:0;text-align:start}
.quick-card .hero-money{font-size:clamp(13px,1.8vw,20px);letter-spacing:-.015em;overflow-wrap:normal;word-break:normal}
.quick-card .hero-money bdi{unicode-bidi:isolate;white-space:normal}
/* Every KPI reserves equal areas for labels, numbers and explanatory text. */
.kpi-card{display:flex;flex-direction:column;gap:5px;min-height:152px}
.kpi-card .kpi-label{line-height:1.5;min-height:2.5em;display:block;overflow-wrap:anywhere}
.kpi-card .kpi-value{line-height:1.25;margin:4px 0 3px;overflow-wrap:anywhere;text-align:start;font-variant-numeric:tabular-nums}
.kpi-card .kpi-foot{line-height:1.5;margin-top:auto;min-height:2.5em;display:block;overflow-wrap:anywhere}
/* BI summary cards have one common vertical hierarchy in every viewport. */
.bi-stat-grid{grid-auto-rows:1fr}
.bi-stat{display:flex;flex-direction:column;gap:6px;min-height:149px}
.bi-stat-head{line-height:1.5;min-height:2.6em;align-items:flex-start}
.bi-stat strong{line-height:1.32;margin:2px 0;min-height:1.4em;text-align:start}
.bi-stat small{display:block;line-height:1.5;margin-top:auto;min-height:2.7em;overflow-wrap:anywhere;text-align:start}
.bi-compare-grid{grid-auto-rows:1fr}
.bi-compare-tile{display:flex;flex-direction:column;gap:4px;min-height:171px}
.bi-compare-name{line-height:1.45;min-height:2.75em}
.bi-compare-total{line-height:1.3;margin:0 0 4px;text-align:start;min-height:1.4em}
.bi-compare-change{align-self:flex-start;max-width:100%;min-height:27px}
.bi-compare-desc{margin:auto 0 0;min-height:2.8em;line-height:1.5}
.bi-duo-track{width:100%}
/* Financial values keep internal LTR number ordering, while the outer alignment follows the page. */
body.arabic .bi-stat strong,body.arabic .bi-compare-total,body.arabic .bi-mini-total,body.arabic .bi-entry-amount,body.arabic .bi-cat-value,body.arabic .bi-category-head small{text-align:right}
body:not(.arabic) .bi-stat strong,body:not(.arabic) .bi-compare-total,body:not(.arabic) .bi-mini-total,body:not(.arabic) .bi-entry-amount,body:not(.arabic) .bi-cat-value{text-align:left}
/* Consistent chart title bars, spacing, legends and detail rows. */
.bi-card{display:flex;flex-direction:column}
.bi-card-head{min-height:59px;align-items:flex-start;gap:12px}
.bi-card-head h3{line-height:1.4}
.bi-card-head .bi-pill,.bi-card-head .bi-metric-select{flex-shrink:0}
.bi-grid>.bi-card{height:100%}
.bi-legend,.bi-split-legend{row-gap:8px;line-height:1.5}
.bi-stat,.bi-compare-tile,.bi-insight-note,.bi-card,.card{scroll-margin-top:100px}
.bi-insight-note{min-width:0}
.bi-progress-label,.bi-category-head,.bi-detail-head,.bi-entry{min-width:0}
.bi-category-head>strong{overflow-wrap:anywhere}
.bi-selected-ledger{max-width:100%}
.bi-sheet-scroll,.bi-scroll{overscroll-behavior-x:contain}
/* Consistent column widths and touch targets for lists and settings. */

.settings-actions button{min-height:42px}
.setting-line{align-items:center}
.theme-control-head,.theme-selection-summary{line-height:1.5}
.theme-color-option{min-width:0}
.theme-color-option>span:last-child{overflow-wrap:anywhere;text-align:center}
.theme-mode-option{justify-content:flex-start}
.modal-actions{flex-wrap:wrap}
.bi-ledger th,.bi-ledger td{font-variant-numeric:tabular-nums}
@media(max-width:1100px){
 .bi-stat-grid{grid-auto-rows:1fr}
 .bi-compare-grid{grid-auto-rows:1fr}
}
@media(max-width:780px){
 .bi-card-head{min-height:0}
 .bi-intro{align-items:stretch}
 .bi-section-title{align-items:flex-start}
 .bi-compare-tile{min-height:151px}
 .quick-card{grid-template-rows:minmax(29px,auto) minmax(2.8em,auto)}
 .bi-stat{min-height:135px}
 .kpi-card{min-height:145px}
}
@media(max-width:520px){
 .view{padding:16px}
 .grid{gap:12px}
 .grid.kpis,.quick-grid{gap:10px}
 .quick-card{padding:12px 11px;grid-template-rows:minmax(35px,auto) minmax(2.95em,auto);gap:5px}
 .quick-card strong{font-size:clamp(16px,4.3vw,20px)}
 .quick-card .hero-money{font-size:clamp(12px,3.6vw,16px);line-height:1.32}
 .quick-card>span{font-size:clamp(12px,3.4vw,14px);line-height:1.38}
 .hero{padding:18px}
 .kpi-card{min-height:144px;padding:14px;gap:4px}
 .kpi-card .kpi-value{font-size:clamp(17px,5vw,24px);line-height:1.3}
 .bi-stat{min-height:137px;padding:14px 12px}
 .bi-stat strong{font-size:clamp(15px,4.1vw,20px)}
 .bi-compare-tile{min-height:156px}
 .bi-donut-zone{gap:16px}
 .bi-status-legend .group{min-width:0}
}
@media(max-width:355px){
 .quick-card{padding:11px 9px}
 .quick-card>span{font-size:12px}
 .quick-card .hero-money{font-size:12px}
 .bi-stat-head{font-size:11px}
 .bi-stat strong{font-size:15px}
 .bi-category{padding-inline:5px}
 .topbar-actions{gap:4px}
}


/* Tight, matching card heights with special handling for long currency strings. */
.quick-card{grid-template-rows:minmax(25px,auto) minmax(2.15em,auto);gap:4px;padding:13px 14px}
.kpi-card{min-height:131px}
.kpi-card .kpi-label,.kpi-card .kpi-foot{min-height:2em}
.money-kpi .kpi-value{font-size:clamp(14px,1.6vw,20px);line-height:1.4;white-space:normal;overflow-wrap:normal;word-break:normal}
@media(max-width:780px){
 .quick-card{grid-template-rows:minmax(25px,auto) minmax(2.3em,auto)}
 .kpi-card{min-height:131px}
}
@media(max-width:520px){
 .quick-card{padding:12px 11px;grid-template-rows:minmax(26px,auto) minmax(2.35em,auto);gap:4px}
 .kpi-card{min-height:129px}
 .money-kpi .kpi-value{font-size:clamp(14px,3.5vw,17px)}
}
@media(max-width:355px){.quick-card{padding:11px 9px;grid-template-rows:minmax(28px,auto) minmax(2.35em,auto)}}


/* Keep the number baseline and label start identical, including currency cells. */
.quick-card{grid-template-rows:minmax(38px,auto) minmax(2.15em,auto)}
.quick-card strong{min-height:38px;display:flex;align-items:flex-end;justify-content:flex-start}
@media(max-width:520px){.quick-card{grid-template-rows:minmax(38px,auto) minmax(2.35em,auto)}}


/* Extra-long amounts must remain fully readable, never hidden outside narrow cards. */
.quick-card .hero-money bdi{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.money-kpi .kpi-value{white-space:normal;overflow-wrap:anywhere;word-break:break-word}


/* Soft neon logo square — follows the selected color theme. */
.brand .brand-mark{
 border:1px solid rgba(255,255,255,.28);
 box-shadow:0 0 8px rgba(120,120,255,.45),0 0 18px rgba(120,120,255,.25);
 box-shadow:0 0 8px color-mix(in srgb,var(--neon-brand-a) 60%,transparent),
  0 0 18px color-mix(in srgb,var(--neon-brand-b) 35%,transparent),
  inset 0 0 8px rgba(255,255,255,.18);
 text-shadow:0 0 6px rgba(255,255,255,.55);
}

/* Language button: flag + code; flag only on narrow phones so the top bar never wraps. */
.lang-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;padding:0 9px}
.lang-flag{font-size:17px;line-height:1}
@media(max-width:400px){.lang-btn .lang-code{display:none}.lang-btn{padding:0;min-width:44px}}

/* Reminders & notifications card */
.notify-card{margin-top:18px}
.notify-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notify-head h3{margin:0}
.notify-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.notify-status.ok{background:color-mix(in srgb,#22c55e 16%,transparent);color:#16a34a}
.notify-status.warn{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#b45309}
body.dark .notify-status.ok{color:#4ade80}
body.dark .notify-status.warn{color:#fbbf24}
.notify-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.notify-row:first-of-type{border-top:0}
.notify-row .notify-text{display:grid;gap:3px;min-width:0}
.notify-row .notify-text strong{font-size:14px}
.notify-row .notify-text small{color:var(--muted);font-size:12px;line-height:1.5}
.notify-controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.notify-controls select,.notify-controls input[type=time]{width:auto;min-width:0;height:38px;padding:0 9px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
.notify-controls select:disabled,.notify-controls input:disabled{opacity:.45}
.switch{position:relative;display:inline-block;width:46px;height:27px;flex-shrink:0}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--accent-button,var(--primary))}
.switch input:checked+span::after{transform:translateX(19px)}
body.arabic .switch input:checked+span::after{transform:translateX(-19px)}
.switch input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.notify-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.notify-note{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.notify-sub{opacity:1;transition:opacity .2s}
.notify-sub.off{opacity:.5}
@media(max-width:520px){.notify-row{align-items:flex-start}.notify-controls{flex-direction:column-reverse;align-items:flex-end;gap:8px}}

.link-btn{background:none;border:0;padding:0;color:var(--primary);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

/* iPhone home-screen app: keep content clear of the notch / Dynamic Island and the home bar. */

 .topbar { border-top: env(safe-area-inset-top) solid transparent; }

}
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

function safe(v=''){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function id(){return typeof crypto!=='undefined' && crypto.randomUUID? crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function dateLocal(d=new Date()) {const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`;}
const monthLocal=()=>dateLocal().slice(0,7);
function dateLabel(s){if(!s)return tr('بدون موعد','No date');const dt=new Date(`${s.slice(0,10)}T12:00:00`);return isNaN(dt)?safe(s):new Intl.DateTimeFormat(state.lang==='ar'?'ar-SA-u-nu-latn':'en-GB',{day:'numeric',month:'short',year:'numeric'}).format(dt);}
function money(n){const val=Number(n)||0;try{return new Intl.NumberFormat(state.lang==='ar'?'ar-SA-u-nu-latn':'en-SA',{style:'currency',currency:state.profile.currency||'SAR',maximumFractionDigits:2}).format(val)}catch{return `${val.toFixed(2)} SAR`;}}
function profileInitial(){const name=String(state?.profile?.name||'').trim()||'Daily';const first=Array.from(name)[0]||'D';return /[A-Za-z]/.test(first)?first.toUpperCase():first;}
function normalize(input){
 const data=(input && typeof input==='object' && !Array.isArray(input))?input:{};
 const result={...defaultState,...data};
 result.profile={...defaultState.profile,...(data.profile && typeof data.profile==='object'?data.profile:{})};
 for(const k of collectionKeys) result[k]=Array.isArray(data[k])?data[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v)).map(v=>({...v,id:typeof v.id==='string'&&/^[\w-]{1,100}$/.test(v.id)?v.id:id()})):[];
 // Import older dark/light backups and presets without losing their selected color.
 const legacyTheme=/^(blue|green|red|orange|pink|purple|cyan|gold)-(dark|light)$/.exec(data.theme||'');
 result.theme = legacyTheme ? legacyTheme[2] : (data.theme==='dark'?'dark':'light');
 result.accent = COLOR_PRESETS[data.accent] ? data.accent : (legacyTheme ? legacyTheme[1] : 'blue');
 result.lang = data.lang==='en'?'en':'ar';
 return result;
}

let searchText={};let toastTimer;let lastFocus=null;
function save(){scheduleReminderSync();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageEnabled=true;}catch{storageEnabled=false;message(tr('تعذر حفظ البيانات. صدّر نسخة احتياطية الآن.','Could not save data. Export a backup now.'),true);}updateStorage();}
function updateStorage(){const count=collectionKeys.reduce((sum,k)=>sum+state[k].length,0);$('#storageCount').textContent=`${count} ${tr('سجل','records')}`;$('#storageLabel').textContent=storageEnabled?tr('محفوظة في هذا المتصفح','Saved in this browser'):tr('الحفظ غير متاح — صدّر نسخة','Storage unavailable — export data');}

function progress(n){return Math.max(0,Math.min(100,Number(n)||0));}
const percent=(n,total)=>total?Math.round(n/total*100):0;
function appearanceColor(){return (COLOR_PRESETS[state.accent]||COLOR_PRESETS.blue)[state.theme==='dark'?'dark':'light'];}
function appearanceName(){const color=COLOR_PRESETS[state.accent]||COLOR_PRESETS.blue;return tr(color.ar,color.en)+' + '+(state.theme==='dark'?tr('أسود','Black'):tr('أبيض','White'));}

   '--neon-brand-a':preset.brand[0],'--neon-brand-b':preset.brand[1],

}

function kpi(label,value,foot,metricClass=''){return `<div class="card kpi-card ${metricClass}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></div>`;}

function header(title,subtitle,type,extra=''){return `<div class="section-head module-head"><div><h3>${title}</h3><p class="muted subheading">${subtitle}</p></div>${btn('＋ '+tr('إضافة','Add'),'add',type,'','primary-btn')}</div>${extra}`;}
function empty(type,search=false){const ico={routine:'📅',work:'💼',education:'📚',finance:'💰',goal:'🎯',note:'📝'}[type]||'✨';return `<div class="empty-state"><div class="empty-icon">${ico}</div><strong>${search?tr('ما لقينا نتائج','No matching results'):tr('ابدأ بإضافة أول سجل','Start with your first entry')}</strong><p>${search?tr('جرّب كلمة بحث ثانية أو غيّر الفلتر.','Try another search or clear the filter.'):tr('كل ما تضيفه ينعرض هنا تلقائيًا.','Everything you add will appear here automatically.')}</p>${!search?btn('＋ '+tr('إضافة الآن','Add now'),'add',type,'','primary-btn'):''}</div>`;}

function actions(type,x){return `<div class="actions">${btn(tr('تعديل','Edit'),'edit',type,x.id,'action-btn')}${btn(tr('حذف','Delete'),'delete',type,x.id,'action-btn danger-inline')}</div>`;}

function cardRoutine(x){const done=!!x.done,late=isOverdue(x.date,done);return `<div class="list-item ${done?'completed':''}" data-search="${safe([x.title,x.category,x.date].join(' ').toLowerCase())}"><button type="button" class="check-toggle ${done?'checked':''}" data-action="toggleRoutine" data-type="routine" data-id="${safe(x.id)}" aria-label="${done?tr('إعادة فتح المهمة','Mark not done'):tr('إكمال المهمة','Mark complete')}" aria-pressed="${done}">${done?'✓':''}</button><div class="list-item-main grow"><h4>${safe(x.title)}</h4><p>🗓 ${dateNote(x.date)} ${x.time?'· '+safe(x.time):''} · ${safe(term(x.category||'Routine'))}</p></div><span class="badge ${done?'done':late?'high':'pending'}">${done?tr('مكتملة','Done'):late?tr('متأخرة','Overdue'):tr('قيد التنفيذ','To do')}</span>${actions('routine',x)}</div>`;}

function cardEducation(x){const n=progress(x.progress);return `<div class="list-item" data-search="${safe([x.title,x.type,x.notes].join(' ').toLowerCase())}"><div class="list-item-main grow"><h4>${safe(x.title)}</h4><p>${term(x.type||'Course')} · ${x.target?dateNote(x.target):tr('بدون موعد','No target date')} · <strong>${n}%</strong></p>${bar(n)}</div><div class="stepper">${btn('−10','progressDown','education',x.id,'action-btn')}${btn('+10','progressUp','education',x.id,'action-btn')}</div>${actions('education',x)}</div>`;}

const sortRecent=(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'');
function listModule(type,title,subtitle,items,cardFn,options={}){
 const n=items.length;const hasFilter=options.filters?.length;const useSearch=n>0;
 const control=hasFilter?`<select class="compact-select" data-filter="${type}" aria-label="${tr('تصفية','Filter')}">${options.filters.map(([v,ar,en])=>`<option value="${safe(v)}" ${(type==='routine'?filters.today:type==='goal'?filters.goals:filters[type])===v?'selected':''}>${tr(ar,en)}</option>`).join('')}</select>`:'';
 const search=useSearch?`<input class="search-input" type="search" data-search-input="${type}" placeholder="${tr('ابحث هنا...','Search here...')}" value="${safe(searchText[type]||'')}" aria-label="${tr('بحث','Search')}" />`:'';

const BI_COLORS=['#60a5fa','#a78bfa','#34d399','#fb923c','#f472b6','#22d3ee','#fbbf24','#f87171'];
function biNumber(x){const v=Number(x)||0;const f=new Intl.NumberFormat(state.lang==='ar'?'ar-SA-u-nu-latn':'en-US',{notation:'compact',maximumFractionDigits:1});return f.format(v);}
function biMonths(count){const d=new Date(),result=[];for(let i=count-1;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);result.push(dateLocal(m).slice(0,7));}return result;}
function biMonthLabel(m){const dt=new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1);return new Intl.DateTimeFormat(state.lang==='ar'?'ar-SA-u-nu-latn':'en-US',{month:'short'}).format(dt);}
function biReadMonths(months){const sums=months.map(m=>({month:m,income:0,expense:0,net:0}));const index=new Map(sums.map((m,i)=>[m.month,i]));const category=new Map();const expenseEntries=[];for(const x of state.finance){const month=String(x.date||'').slice(0,7),i=index.get(month),amount=Number(x.amount);if(i===undefined||!Number.isFinite(amount)||amount<=0)continue;if(x.type==='Income')sums[i].income+=amount;else if(x.type==='Expense'){sums[i].expense+=amount;const key=String(x.category||'Other');category.set(key,(category.get(key)||0)+amount);expenseEntries.push(x);}}
 for(const m of sums)m.net=m.income-m.expense;return {sums,category,expenseEntries};}
function biTopCards(sums){const inc=sums.reduce((s,m)=>s+m.income,0),exp=sums.reduce((s,m)=>s+m.expense,0),net=inc-exp;const rate=inc>0?Math.round(net/inc*100):null;const items=[
 [tr('إجمالي الدخل','Total income'),money(inc),tr('خلال الفترة المحددة','In selected period'),'#10b981'],
 [tr('إجمالي المصروف','Total spending'),money(exp),tr('خلال الفترة المحددة','In selected period'),'#f87171'],
 [tr('صافي التدفق','Net cash flow'),money(net),tr('الدخل ناقص المصروف','Income less expenses'),'var(--primary)'],
 [tr('نسبة الادخار','Savings rate'),rate===null?'—':rate+'%',rate===null?tr('أضف دخلًا لحساب النسبة','Add income to calculate'):tr('الصافي من إجمالي الدخل','Net as a share of income'),'#fbbf24']
 ];return `<div class="bi-stat-grid">${items.map(([title,value,note,color])=>`<div class="bi-stat"><div class="bi-stat-head"><i class="bi-stat-dot" style="background:${color}"></i>${safe(title)}</div><strong dir="ltr">${safe(value)}</strong><small>${safe(note)}</small></div>`).join('')}</div>`;}
function biCompare(sums){const max=Math.max(0,...sums.flatMap(x=>[x.income,x.expense]));if(max<=0)return biEmpty(tr('أضف دخلًا أو مصروفًا لعرض المقارنة.','Add income or expenses to see the comparison.'));
 return `<div class="bi-legend"><span><i style="background:#10b981"></i>${tr('الدخل','Income')}</span><span><i style="background:#f87171"></i>${tr('المصروف','Expenses')}</span></div><div class="bi-bars" style="min-width:max(100%,${sums.length*52}px)" role="img" aria-label="${safe(tr('مقارنة الدخل والمصروفات شهريًا','Monthly income versus expenses'))}">${sums.map(s=>`<div class="bi-bars-col"><div class="bi-bars-bars"><div class="bi-rect" style="background:#10b981;--bar-height:${Math.max(s.income>0?2:0,s.income/max*100)}%" title="${safe(biMonthLabel(s.month)+' · '+tr('الدخل','Income')+': '+money(s.income))}"></div><div class="bi-rect" style="background:#f87171;--bar-height:${Math.max(s.expense>0?2:0,s.expense/max*100)}%" title="${safe(biMonthLabel(s.month)+' · '+tr('المصروف','Expenses')+': '+money(s.expense))}"></div></div><div class="bi-bars-label" dir="auto">${safe(biMonthLabel(s.month))}</div></div>`).join('')}</div>`;}
function biTrend(sums,metric='net'){if(!sums.some(x=>x.income>0||x.expense>0))return biEmpty(tr('سيظهر الاتجاه بعد تسجيل معاملات مالية.','The trend appears when you add transactions.'));
 const key=['income','expense','net'].includes(metric)?metric:'net';const values=sums.map(m=>m[key]),mx=Math.max(0,...values),mn=Math.min(0,...values),range=Math.max(1,mx-mn),w=660,h=220,top=20,bottom=180,left=64,right=642;
 const x=i=>left+(right-left)*(sums.length===1?.5:i/(sums.length-1)),y=v=>top+(mx-v)/range*(bottom-top);
 const pts=values.map((v,i)=>[x(i),y(v)]),d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),area=d+` L${pts[pts.length-1][0].toFixed(1)} ${bottom} L${pts[0][0].toFixed(1)} ${bottom} Z`;
 const ticks=Array.from({length:5},(_,i)=>mx-range*i/4);const baseline=y(0);
 return `<svg class="bi-line-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${safe(tr('الاتجاه الشهري للمؤشر المختار','Monthly trend of selected metric'))}">${ticks.map(t=>`<line class="gridline" x1="${left}" x2="${right}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text text-anchor="end" x="${left-8}" y="${(y(t)+4).toFixed(1)}">${safe(biNumber(t))}</text>`).join('')}<line class="baseline" x1="${left}" x2="${right}" y1="${baseline.toFixed(1)}" y2="${baseline.toFixed(1)}"/><path class="trendarea" d="${area}"/><path class="trendline" d="${d}"/>${pts.map((p,i)=>`<circle class="point" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5"><title>${safe(sums[i].month+' · '+money(values[i]))}</title></circle><text text-anchor="middle" x="${p[0].toFixed(1)}" y="207">${safe(biMonthLabel(sums[i].month))}</text>`).join('')}</svg>`;}
function biEmpty(message){return `<div class="bi-empty"><div><span>📊</span>${safe(message)}</div></div>`;}
function biDonut(category,expenseEntries){let entries=Array.from(category.entries()).sort((a,b)=>b[1]-a[1]);const sum=entries.reduce((s,x)=>s+x[1],0);if(!sum){biCategory='all';return biEmpty(tr('سجّل مصروفات لكي يظهر توزيع الفئات.','Add expenses to see a category breakdown.'));}
 const otherKeys=entries.slice(5).map(x=>x[0]);if(entries.length>6){const others=entries.slice(5).reduce((s,x)=>s+x[1],0);entries=[...entries.slice(0,5),["__other__",others]];}
 const names=entries.map(x=>x[0]);if(biCategory!=='all'&&!names.includes(biCategory))biCategory='all';let accum=0;
 const stops=entries.map(([k,value],i)=>{const a=accum,b=Math.min(100,accum+value/sum*100);accum=b;return `${BI_COLORS[i%BI_COLORS.length]} ${a.toFixed(2)}% ${b.toFixed(2)}%`;}).join(',');
 const main=`<div class="bi-donut-zone"><div class="bi-donut" style="background:conic-gradient(${stops})" role="img" aria-label="${safe(tr('تصنيف المصروفات','Spending category breakdown'))}"><div class="bi-donut-hole"><strong>${safe(biNumber(sum))}</strong><span>${safe(state.profile.currency||'SAR')} · ${tr('المصروف','spent')}</span></div></div><div class="bi-categories">${entries.map(([key,value],i)=>`<button type="button" class="bi-category" data-action="biCategory" data-bi-cat="${safe(key)}" aria-pressed="${biCategory===key}"><span class="bi-category-dot" style="background:${BI_COLORS[i%BI_COLORS.length]}"></span><span class="bi-cat-name">${key==='__other__'?tr('فئات أخرى','Other categories'):safe(term(key))}</span><span class="bi-cat-value">${Math.round(value/sum*100)}%</span></button>`).join('')}</div></div>`;
 let filtered=expenseEntries;if(biCategory==='__other__')filtered=filtered.filter(x=>otherKeys.includes(String(x.category||'Other')));else if(biCategory!=='all')filtered=filtered.filter(x=>String(x.category||'Other')===biCategory);
 const ordered=[...filtered].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,4);
 const detail=`<div class="bi-detail"><div class="bi-detail-head"><span>${tr('أحدث العمليات','Recent transactions')} · ${filtered.length}</span>${biCategory==='all'?'':`<button type="button" class="bi-link" style="margin:0" data-action="biCategory" data-bi-cat="all">${tr('عرض الكل','Show all')}</button>`}</div>${ordered.map(x=>`<div class="bi-entry"><div class="bi-entry-text"><span>${safe(x.note||term(x.category)||tr('مصروف','Expense'))}</span><small>${safe(dateLabel(x.date))}</small></div><span class="bi-entry-amount" dir="ltr">${safe(money(x.amount))}</span></div>`).join('')}</div>`;
 return main+detail;}
function biProgress(){const workTotal=state.work.length,workDone=state.work.filter(x=>x.status==='Done').length,dayTotal=state.routines.length,dayDone=state.routines.filter(x=>x.done).length,goalsTotal=state.goals.length,goalsDone=state.goals.filter(x=>progress(x.progress)>=100).length,studyTotal=state.education.length,studyMean=studyTotal?Math.round(state.education.reduce((s,x)=>s+progress(x.progress),0)/studyTotal):0;
 const metrics=[[tr('العمل','Work'),workDone,workTotal,'#60a5fa'],[tr('المهام اليومية','Daily tasks'),dayDone,dayTotal,'#34d399'],[tr('الأهداف','Goals'),goalsDone,goalsTotal,'#a78bfa'],[tr('التعلّم','Learning'),studyMean,studyTotal?'%':0,'#fbbf24']];
 return metrics.map(([label,n,total,c],i)=>{const pct=i===3?n:percent(n,total);return `<div class="bi-progress-item"><div class="bi-progress-label"><span>${label}</span><strong dir="ltr">${pct}% ${i===3?'':`· ${n}/${total}`}</strong></div><div class="bi-track"><div class="bi-fill" style="--fill-percent:${pct}%;background:${c}"></div></div></div>`;}).join('')+`<div class="bi-insight"><span class="bi-insight-icon">💡</span><span>${tr('المؤشرات تُحسب تلقائيًا من المهام والأهداف والدورات المسجلة؛ لا تُحسب من أمثلة أو بيانات وهمية.','Metrics are calculated from your recorded tasks, goals and courses, not sample data.')}</span></div>`;}
function biMiniPreview(){const last=biReadMonths(biMonths(6)).sums;const vals=last.map(x=>x.expense),max=Math.max(1,...vals),has=vals.some(v=>v>0),n=last.length;
 return `<div class="card bi-mini-card"><div class="bi-mini"><div><div class="bi-mini-title">📊 ${tr('لمحة من تحليلاتك','Your insights')}</div><div class="bi-mini-label">${tr('مصروف آخر 6 أشهر','Expenses · last 6 months')}</div><div class="bi-mini-total">${has?safe(money(vals.reduce((a,b)=>a+b,0))):'—'}</div></div><svg class="bi-mini-spark" viewBox="0 0 160 50" role="img" aria-label="${tr('ملخص بصري للمصروفات','Spending sparkline')}">${has?`<path d="${vals.map((v,i)=>`${i===0?'M':'L'}${6+i*29.6} ${42-v/max*34}`).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${6+i*29.6}" cy="${42-v/max*34}" r="3" fill="var(--primary)"/>`).join('')}`:`<line x1="0" x2="155" y1="40" y2="40" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>`}</svg></div><button type="button" class="bi-link" data-action="go" data-type="reports">${tr('عرض لوحة التحليلات','Open analytics dashboard')} ↗</button></div>`;}

// Additional BI panels. Periods use calendar months; the current month is partial.
function biPreviousMonths(months){const oldest=months[0];const [yy,mm]=oldest.split('-').map(Number);return Array.from({length:months.length},(_,i)=>{const d=new Date(yy,mm-1-months.length+i,1);return dateLocal(d).slice(0,7);});}
function biTotals(sums){return sums.reduce((a,m)=>({income:a.income+m.income,expense:a.expense+m.expense,net:a.net+m.net}),{income:0,expense:0,net:0});}
function biChange(current,previous){if(previous===0)return null;return (current-previous)/Math.abs(previous)*100;}
function biComparePeriods(now,prior){const n=biTotals(now),p=biTotals(prior);
 const cols=[['income',tr('الدخل','Income'),'#10b981',true],['expense',tr('المصروفات','Spending'),'#ef7777',false],['net',tr('صافي التدفق','Net cash flow'),'var(--primary)',true]];
 return `<div class="bi-compare-grid">${cols.map(([k,label,color,positive])=>{const a=n[k],b=p[k],change=biChange(a,b);const cls=change===null?'':Math.abs(change)<.05?'':(change>0)===positive?'good':'bad';const arrow=change===null?'—':`${change>0?'↑':change<0?'↓':'→'} ${Math.abs(change).toFixed(1)}%`;
 const max=Math.max(Math.abs(a),Math.abs(b),1);return `<div class="bi-compare-tile"><div class="bi-compare-name">${label}</div><div class="bi-compare-total">${safe(money(a))}</div><span class="bi-compare-change ${cls}">${safe(arrow)}</span><p class="bi-compare-desc">${tr('الفترة السابقة','Previous period')}: <strong dir="ltr">${safe(money(b))}</strong></p><div class="bi-duo-track" aria-hidden="true"><span class="bi-duo-current" style="background:${color};width:${(Math.abs(a)/max*100).toFixed(2)}%"></span><span class="bi-duo-previous" style="width:${(Math.abs(b)/max*100).toFixed(2)}%"></span></div>${change===null?`<p class="bi-help-line">${tr('لا توجد قيمة سابقة مناسبة لحساب النسبة.','No usable previous value for a percentage change.')}</p>`:''}</div>`;}).join('')}</div>`;}
function biSmartInsights(current,prior,categories){const n=biTotals(current),p=biTotals(prior),total=state.finance.filter(x=>Number(x.amount)>0).length;
 if(!total)return `<div class="bi-insight-note"><span class="glyph">📝</span><div><strong>${tr('اللوحة جاهزة','Your dashboard is ready')}</strong><p>${tr('ابدأ بتسجيل معاملاتك في المالية لتظهر المقارنات والاستنتاجات المبنية على بياناتك.','Add financial transactions to see meaningful comparisons and insights.')}</p></div></div>`;
 const items=[];
 if(n.income>0){const rate=n.net/n.income*100;items.push(['💰',tr('نسبة صافي التدفق','Net cash-flow ratio'),tr('صافي التدفق يساوي ','Net cash flow represents ')+`${rate.toFixed(1)}%`+tr(' من الدخل المسجّل في الفترة.',' of recorded income during the period.')]);}
 if(p.expense>0){const d=biChange(n.expense,p.expense);items.push([d<=0?'📉':'📈',tr('حركة الإنفاق','Spending movement'),d===0?tr('الإنفاق لم يتغير عن الفترة السابقة.','Spending is unchanged from the previous period.'):Math.abs(d).toFixed(1)+'% · '+(d<0?tr('انخفض الإنفاق عن الفترة السابقة.','Spending decreased versus the previous period.'):tr('ارتفع الإنفاق عن الفترة السابقة.','Spending increased versus the previous period.'))]);}
 const top=[...categories.entries()].sort((a,b)=>b[1]-a[1])[0];if(top && n.expense>0){items.push(['🎯',tr('أكبر بند مصروفات','Largest expense category'),`${tr('الفئة','Category')}: ${term(top[0])} · ${(top[1]/n.expense*100).toFixed(1)}% ${tr('من إنفاق الفترة.','of period spending.')}`]);}
 if(!items.length)items.push(['📊',tr('البيانات المسجلة','Recorded data'),tr('أضف المزيد من العمليات في الفترات الحالية والسابقة لتحسين المقارنة.','Add more records to current and previous periods for richer comparisons.')]);
 return `<div class="bi-insight-row">${items.slice(0,4).map(([icon,title,desc])=>`<div class="bi-insight-note"><span class="glyph">${icon}</span><div><strong>${safe(title)}</strong><p>${safe(desc)}</p></div></div>`).join('')}</div>`;}
function biCategoryComparison(current,prior){const categories=[...new Set([...current.keys(),...prior.keys()])].map(k=>({key:k,now:current.get(k)||0,prev:prior.get(k)||0})).filter(x=>x.now>0||x.prev>0).sort((a,b)=>(b.now+b.prev)-(a.now+a.prev)).slice(0,6);
 if(!categories.length)return biEmpty(tr('أضف مصروفات لتظهر مقارنة فئات الإنفاق.','Add spending transactions to compare categories.'));

function biMonthlyLedger(sums){if(!sums.some(x=>x.income>0||x.expense>0))return biEmpty(tr('سيظهر السجل الشهري بعد إضافة معاملات مالية.','Your monthly breakdown appears when you add transactions.'));
 if(biSelectedMonth && !sums.some(x=>x.month===biSelectedMonth))biSelectedMonth=null;
 const months=[...sums].reverse();const rows=months.map(x=>{const tx=state.finance.filter(t=>String(t.date||'').slice(0,7)===x.month && Number(t.amount)>0 && ['Income','Expense'].includes(t.type));const rate=x.income>0?(x.net/x.income*100).toFixed(1)+'%':'—';return `<tr data-action="biMonth" data-bi-month="${safe(x.month)}" aria-selected="${biSelectedMonth===x.month}"><td><button type="button" data-action="biMonth" data-bi-month="${safe(x.month)}">${safe(x.month)}</button></td><td dir="ltr">${safe(money(x.income))}</td><td dir="ltr">${safe(money(x.expense))}</td><td dir="ltr" class="${x.net<0?'bi-negative':'bi-positive'}">${safe(money(x.net))}</td><td dir="ltr">${rate}</td><td class="bi-transaction-count">${tx.length}</td></tr>`;}).join('');
 const details=biSelectedMonth?biMonthTransactions(biSelectedMonth):'';
 return `<div class="bi-sheet"><div class="bi-sheet-scroll"><table class="bi-ledger"><thead><tr><th>${tr('الشهر','Month')}</th><th>${tr('الدخل','Income')}</th><th>${tr('المصروف','Spending')}</th><th>${tr('الصافي','Net')}</th><th>${tr('معدل الصافي','Net ratio')}</th><th>${tr('العمليات','Entries')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>${details}`;}
function biMonthTransactions(month){const tx=state.finance.filter(t=>String(t.date||'').slice(0,7)===month && Number(t.amount)>0 && ['Income','Expense'].includes(t.type)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const max=12;
 return `<div class="bi-selected-ledger"><div class="bi-detail-head"><span>📅 ${safe(month)} · ${tx.length} ${tr('عملية','entries')}</span><button type="button" class="bi-link" data-action="biMonth" data-bi-month="" style="margin:0">${tr('إغلاق','Close')} ×</button></div>${tx.length?tx.slice(0,max).map(x=>`<div class="bi-entry"><span class="bi-entry-text"><span>${safe(x.note||term(x.category)||term(x.type))}</span><small>${safe(dateLabel(x.date))} · ${safe(term(x.category))}</small></span><span class="bi-entry-amount ${x.type==='Expense'?'bi-negative':'bi-positive'}" dir="ltr">${x.type==='Expense'?'−':'+'}${safe(money(x.amount))}</span></div>`).join(''):biEmpty(tr('لا توجد عمليات في هذا الشهر.','No transactions in this month.'))}${tx.length>max?`<p class="bi-help-line">${tr('يعرض أحدث 12 عملية من أصل','Showing the latest 12 of')} ${tx.length}</p>`:''}</div>`;}
function biWeekActivity(){const start=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()-i);const day=dateLocal(d),entries=state.routines.filter(x=>x.date===day),done=entries.filter(x=>x.done).length;days.push({day,total:entries.length,done});}
 if(!days.some(x=>x.total))return biEmpty(tr('أضف مهام بتاريخ خلال آخر 7 أيام لتظهر المتابعة اليومية.','Record dated daily tasks in the last seven days to see activity.'));
 const max=Math.max(1,...days.map(x=>x.total));return `<div class="bi-week-bars" role="img" aria-label="${tr('المهام المكتملة والمجدولة لآخر 7 أيام','Completed and scheduled tasks over the last seven days')}">${days.map(x=>{const lab=x.day.slice(5),rate=x.total?Math.round(x.done/x.total*100):0;return `<div class="bi-week-day" title="${safe(x.day+' · '+x.done+'/'+x.total)}"><span class="bi-week-ratio" dir="ltr">${x.done}/${x.total}</span><div class="bi-week-bar"><span class="bi-week-filled" style="height:${x.total?Math.max(5,x.done/max*100):0}%"></span></div><span class="bi-week-label" dir="ltr">${lab}</span></div>`;}).join('')}</div><p class="bi-help-line">${tr('الأرقام حسب تاريخ المهمة وحالتها الحالية، وليست سجلًا تاريخيًا لوقت إكمالها.','Based on task date and current completion status, not historical completion timestamps.')}</p>`;}
function biWorkSnapshot(){const tasks=state.work,done=tasks.filter(x=>x.status==='Done').length,pending=tasks.filter(x=>x.status==='Pending').length,open=tasks.length-done-pending;const overdue=tasks.filter(x=>x.status!=='Done'&&x.due&&x.due<dateLocal()).length,urgent=tasks.filter(x=>x.status!=='Done'&&x.priority==='High').length;
 if(!tasks.length)return biEmpty(tr('سجّل مهام العمل لرؤية توزيع الحالات والأولويات.','Add work tasks to see statuses and priorities.'));

function renderView(){
 const renderers={dashboard:renderDashboard,today:renderToday,work:renderWork,education:renderEducation,finance:renderFinance,goals:renderGoals,notes:renderNotes,reports:renderReports,settings:renderSettings};renderers[currentView]();applyClientFilter();

function renderAll(){updateChrome();renderView();updateStorage();}
function applyClientFilter(){const type={today:'routine',work:'work',education:'education',finance:'finance',goals:'goal',notes:'note'}[currentView];if(!type)return;
 const termText=(searchText[type]||'').toLocaleLowerCase();const container=$(`[data-list="${type}"]`);if(!container)return;const cards=Array.from(container.querySelectorAll('.list-item'));let shown=0;
 for(const card of cards){const matched=(card.dataset.search||'').includes(termText);card.classList.toggle('hidden',!matched);if(matched)shown++;}
 const count=$(`[data-count="${type}"]`);if(count)count.textContent=`${shown} ${tr('عنصر','items')}`;
 const emptyEl=$(`[data-empty-filter="${type}"]`);if(emptyEl)emptyEl.classList.toggle('hidden',shown>0||cards.length===0);
}
function createPicker(){
 editContext={picker:true};lastFocus=document.activeElement;
 $('#modalTitle').textContent=tr('إيش تبغى تضيف؟','What would you like to add?');
 const options=[['routine','📅','مهمة يومية','Daily task'],['work','💼','مهمة عمل','Work task'],['education','📚','دراسة / شهادة','Course / certification'],['finance','💰','عملية مالية','Transaction'],['goal','🎯','هدف','Goal'],['note','📝','ملاحظة','Note']];
 $('#modalForm').innerHTML=`<div class="picker-grid">${options.map(([type,icon,ar,en])=>`<button type="button" class="picker-tile" data-action="add" data-type="${type}"><span>${icon}</span><strong>${tr(ar,en)}</strong></button>`).join('')}</div>`;showModal();
}
function fieldHTML([name,ar,en,type,required,options],item){
 const lbl=tr(ar,en)+(required?' *':'');const defaultValue={date:dateLocal(),progress:'0',priority:'Medium',status:'Open',category:'Other',type:'Expense'};
 const value=item?.[name]??(name==='date'?dateLocal():(defaultValue[name]??''));const idAttribute=`fld-${name}`;
 if(type==='select')return `<div class="form-row"><label for="${idAttribute}">${lbl}</label><select id="${idAttribute}" name="${name}">${options.map(opt=>`<option value="${safe(opt)}" ${value===opt?'selected':''}>${safe(term(opt))}</option>`).join('')}</select></div>`;
 if(type==='checkbox')return `<label class="checkbox-field" for="${idAttribute}"><input id="${idAttribute}" name="${name}" type="checkbox" ${value?'checked':''}/><span>${tr(ar,en)}</span></label>`;
 if(type==='textarea')return `<div class="form-row"><label for="${idAttribute}">${lbl}</label><textarea id="${idAttribute}" name="${name}" rows="3" ${required?'required':''} maxlength="5000">${safe(value)}</textarea></div>`;
 const attrs=type==='number'?'min="0" max="100" step="1"':type==='money'?'min="0.01" step="0.01" inputmode="decimal"':'maxlength="200"';
 return `<div class="form-row"><label for="${idAttribute}">${lbl}</label><input id="${idAttribute}" name="${name}" type="${type==='money'?'number':type}" value="${safe(value)}" ${required?'required':''} ${attrs} /></div>`;
}
function openModal(type,itemId=null){const config=defs[type];if(!config)return;
 const item=itemId?state[config.collection].find(x=>x.id===itemId):null;if(itemId&&!item)return;
 editContext={type,id:itemId};lastFocus=document.activeElement;
 $('#modalTitle').textContent=(itemId?tr('تعديل ','Edit '):tr('إضافة ','Add '))+tr(config.ar,config.en);
 const important=config.fields.filter(f=>f[0]==='title'||f[0]==='type'||f[0]==='amount');const other=config.fields.filter(f=>!important.includes(f));
 $('#modalForm').innerHTML=`${[...important,...other].map(f=>fieldHTML(f,item)).join('')}<div class="modal-actions"><button type="button" class="secondary-btn" data-action="close">${tr('إلغاء','Cancel')}</button><button class="primary-btn" type="submit">${itemId?tr('حفظ التغييرات','Save changes'):tr('إضافة وحفظ','Add & save')}</button></div>`;
 showModal();setTimeout(()=>$('#modalForm input:not([type="checkbox"]), #modalForm select')?.focus(),30);
}
function showModal(){$('#modalBackdrop').classList.remove('hidden');document.body.classList.add('modal-open');}
function closeModal(){$('#modalBackdrop').classList.add('hidden');document.body.classList.remove('modal-open');editContext=null;lastFocus?.focus?.();}
function submitModal(e){e.preventDefault();if(!editContext?.type)return;const cfg=defs[editContext.type];const fd=new FormData(e.currentTarget),out={};
 for(const [name,,,type] of cfg.fields){if(type==='checkbox')out[name]=e.currentTarget.elements[name].checked;else if(type==='number'||type==='money')out[name]=Number(fd.get(name));else out[name]=String(fd.get(name)||'').trim();}
 if(out.title!==undefined&&!out.title.trim())return message(tr('اكتب عنوانًا أولًا','Title is required'),true);
 if(out.amount!==undefined && (!Number.isFinite(out.amount)||out.amount<=0))return message(tr('المبلغ يجب أن يكون أكبر من صفر','Amount must be greater than zero'),true);
 for(const x of ['progress'])if(x in out)out[x]=progress(out[x]);
 if(cfg.collection==='finance' && /^\d{4}-\d{2}/.test(out.date||'')) filters.finance=out.date.slice(0,7);
 if(cfg.collection==='routines' && out.date!==dateLocal()) filters.today='all';
 if(cfg.collection==='work' && out.status==='Done') filters.work='all';
 if(cfg.collection==='goals' && progress(out.progress)===100) filters.goals='all';
 if(editContext.id){const x=state[cfg.collection].find(v=>v.id===editContext.id);if(!x)return;Object.assign(x,out,{updatedAt:new Date().toISOString()});}
 else state[cfg.collection].unshift({id:id(),createdAt:new Date().toISOString(),...out});
 save();closeModal();renderAll();message(tr('تم الحفظ بنجاح','Saved successfully'));
}
function removeItem(type,itemId){const cfg=defs[type];if(!cfg)return;const x=state[cfg.collection].find(v=>v.id===itemId);if(!x)return;
 if(!confirm(tr(`حذف «${x.title||term(x.category)||cfg.ar}» نهائيًا؟`,`Permanently delete “${x.title||x.category||cfg.en}”?`)))return;
 state[cfg.collection]=state[cfg.collection].filter(v=>v.id!==itemId);save();renderView();message(tr('تم الحذف','Deleted'));
}
function exportData(){const json=JSON.stringify({...state,backupDate:new Date().toISOString(),appVersion:'2.5'},null,2);if(window.DailyLifeAndroid){window.DailyLifeAndroid.exportBackup(json);return;}const blob=new Blob([json],{type:'application/json'});const fileName=`daily-life-os-backup-${dateLocal()}.json`;
 // iPhone / iPad: use the share sheet (Save to Files, AirDrop, WhatsApp…) — plain downloads are unreliable there.
 if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare){const file=new File([blob],fileName,{type:'application/json'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Daily Life OS backup'}).then(()=>message(tr('تم إنشاء النسخة الاحتياطية','Backup generated'))).catch(()=>{});return;}}
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);message(tr('تم إنشاء النسخة الاحتياطية','Backup generated'));}
function importData(file){if(!file)return;if(file.size>10*1024*1024)return message(tr('الملف كبير جدًا (الحد 10MB)','Backup is too large (10MB max)'),true);
 const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)||!collectionKeys.some(k=>Array.isArray(parsed[k])))throw new Error('bad format');
 const incoming=normalize(parsed);const count=collectionKeys.reduce((n,k)=>n+incoming[k].length,0);if(!confirm(tr(`استيراد ${count} سجل؟ سيتم استبدال بياناتك الحالية. صدّر نسخة أولًا إن احتجتها.`,`Import ${count} records? This replaces your existing entries. Export a backup first if needed.`)))return;
 state=incoming;save();applyAppearance();renderAll();message(tr('تم استيراد النسخة بنجاح','Backup imported successfully'));
 }catch(e){message(tr('تعذر قراءة النسخة الاحتياطية. تأكد من الملف.','Could not import this backup file.'),true);}finally{$('#importFile').value='';}};reader.onerror=()=>message(tr('حدث خطأ أثناء قراءة الملف','Could not read the file'),true);reader.readAsText(file);}
function importAndroidBackupBase64(base64){try{const data=atob(base64),bytes=new Uint8Array(data.length);for(let i=0;i<data.length;i++)bytes[i]=data.charCodeAt(i);importData(new File([bytes],'android-backup.json',{type:'application/json'}));}catch(e){message(tr('تعذر قراءة النسخة','Could not read the backup'),true);}}
function resetData(){if(!confirm(tr('متأكد من حذف كل البيانات المخزنة هنا؟ لا يمكن التراجع عن هذه الخطوة.','Delete ALL local entries? This cannot be undone.')))return;
 if(!confirm(tr('تأكيد أخير: هل قمت بتصدير نسخة احتياطية؟','Final confirmation: Have you exported a backup?')))return;
 const theme=state.theme,accent=state.accent,lang=state.lang;state=normalize({...defaultState,theme,accent,lang});save();navigate('dashboard');message(tr('تم حذف البيانات','Local data cleared'));
}

function action(e){const b=e.target.closest('[data-action]');if(!b)return;const ac=b.dataset.action,type=b.dataset.type,itemId=b.dataset.id;
 switch(ac){
  case 'go':navigate(type);break;
  case 'quickPick':createPicker();break;
  case 'add':openModal(type);break;
  case 'edit':openModal(type,itemId);break;
  case 'delete':removeItem(type,itemId);break;
  case 'close':closeModal();break;
  case 'toggleRoutine':{const item=state.routines.find(x=>x.id===itemId);if(item)updateRecord('routine',itemId,{done:!item.done});break;}

 <p class="muted subheading">${isIOS()?tr('الآيفون ما يسمح لتطبيقات الويب ترسل تنبيهات وهي مقفلة، فنضيف تذكيراتك لتطبيق التقويم وهو ينبهك في وقتها — حتى بدون إنترنت.','iPhone does not let web apps alert you while closed, so your reminders go into the Calendar app, which alerts you on time — even offline.'):tr('أضف تذكيراتك لتطبيق التقويم عشان ينبهك في وقتها.','Add your reminders to your calendar app so it alerts you on time.')}</p>
 ${row('⏰ '+tr('تذكير المهام اليومية','Daily task reminders'),tr('للمهام اللي لها وقت في صفحة يومي','For tasks with a time in Today'),`<select data-notify="lead" ${s.tasks?'':'disabled'} aria-label="${tr('وقت التذكير','Reminder time')}">${leads.map(([v,ar,en])=>`<option value="${v}" ${Number(s.lead)===v?'selected':''}>${tr(ar,en)}</option>`).join('')}</select>${notifySwitch('tasks',s.tasks,tr('تذكير المهام اليومية','Daily task reminders'))}`)}
 ${row('☀️ '+tr('تذكير يومي','Daily reminder'),tr('كل يوم يذكرك تفتح يومك','Every day, a nudge to plan your day'),`<input type="time" data-notify="summaryTime" value="${safe(s.summaryTime)}" ${s.summary?'':'disabled'} aria-label="${tr('وقت التذكير اليومي','Daily reminder time')}">${notifySwitch('summary',s.summary,tr('تذكير يومي','Daily reminder'))}`)}
 ${row('📌 '+tr('مواعيد الاستحقاق','Due dates'),tr('مهام العمل والأهداف والدورات في يومها','Work tasks, goals and courses on their date'),`<input type="time" data-notify="dueTime" value="${safe(s.dueTime)}" ${s.due?'':'disabled'} aria-label="${tr('وقت تذكير الاستحقاق','Due reminder time')}">${notifySwitch('due',s.due,tr('مواعيد الاستحقاق','Due dates'))}`)}
 <div class="notify-actions"><button type="button" class="primary-btn" data-cal-action="add">📅 ${pend.length?tr(`إضافة ${remCount(pend.length)} للتقويم`,`Add ${remCount(pend.length)} to Calendar`):tr('كل التذكيرات مضافة ✓','All reminders added ✓')}</button>${navigator.canShare?`<button type="button" class="secondary-btn" data-cal-action="share">↗ ${tr('مشاركة ملف التقويم','Share calendar file')}</button>`:''}</div>
 <p class="notify-note">${tr('بعد ما تضيف مهام جديدة، ارجع واضغط الزر — يضيف الجديد بس بدون تكرار.','After adding new tasks, tap the button again — it only adds what is new.')} <button type="button" class="link-btn" data-cal-action="all">${tr('إعادة إضافة الكل','Re-add everything')}</button></p>
 </div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-cal-action]');if(!b)return;const m=b.dataset.calAction;exportCalendar(m==='add'?'new':m);});

document.addEventListener('DOMContentLoaded',init);
document.addEventListener('DOMContentLoaded',initNotifications);

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
